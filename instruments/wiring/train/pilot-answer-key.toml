# Stage 1, the free pilot (US$0): plumbing, within-group variance, base rates. Not the result.
# Pre-registered in notes/lattice-claims-rl-preregistration-2026-10-04.md; the two
# arms of a pair differ ONLY in `grader`. Launch: prime train <this file> -y
name = "lc-pilot-answer-key"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 60
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 1024
temperature = 1.0

[[env]]
id = "carlos-toledo/lattice-claims"
version = "0.2.0"
args = { grader = "answer_key", dims = [8, 12, 16], num_tasks = 1000, seed = 2026, eval_seed = 9999, eval_num_tasks = 300 }

[eval]
interval = 20
num_examples = 300
rollouts_per_example = 1
skip_first_step = false
