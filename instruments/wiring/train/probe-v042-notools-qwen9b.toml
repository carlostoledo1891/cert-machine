# A CONTROL for the tool probe (which logged nothing in 45 min): does 0.4.0 itself (its prime-sandboxes pin) start on Hosted Training WITHOUT the tool? Otherwise identical. -- was: does the Python-tool environment (lattice-claims 0.4.0, tools="python",
# a Prime sandbox per rollout) run on Hosted Training, and what does a rollout cost (tokens + sandbox)?
# Five steps of 32 rollouts (4 tasks x 8) on the 9B, ternary grader, no eval. Read: completion,
# turns and tool calls per rollout, tokens and US$ per rollout, seconds per step. Under US$2 estimated.
name = "lc-probe-v042-notools-qwen9b"
model = "Qwen/Qwen3.5-9B"
max_steps = 2
batch_size = 32
rollouts_per_example = 8

[sampling]
max_tokens = 1536
temperature = 1.0
enable_thinking = false

[[env]]
id = "carlos-toledo/lattice-claims"
version = "0.4.2"
args = { grader = "ternary", dims = [8, 12, 16], num_tasks = 40, seed = 2026, eval_seed = 9999, eval_num_tasks = 1 }
