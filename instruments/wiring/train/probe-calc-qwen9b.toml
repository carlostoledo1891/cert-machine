# A DIAGNOSTIC, not an arm: does the calculator-tool environment (lattice-claims 0.5.0, tools="calc",
# an in-process ToolEnv, no sandbox) load and train on Hosted Training, and what does a rollout cost?
# Five steps of 32 rollouts (4 tasks x 8) on the 9B, ternary grader, no eval. Read: completion, turns
# per rollout, tool calls, tokens and US$ per rollout, seconds per step. Under US$1 estimated.
name = "lc-probe-calc-qwen9b-v051"
model = "Qwen/Qwen3.5-9B"
max_steps = 5
batch_size = 32
rollouts_per_example = 8

[sampling]
max_tokens = 1536
temperature = 1.0
enable_thinking = false

[[env]]
id = "carlos-toledo/lattice-claims"
version = "0.5.1"
args = { grader = "ternary", tools = "calc", max_turns = 10, dims = [8, 12, 16], num_tasks = 40, seed = 2026, eval_seed = 9999, eval_num_tasks = 1 }
