# A DIAGNOSTIC, not an arm (pre-registration deviation 6): does Hosted Training deliver policy
# updates for Qwen3.5-2B when it does not for Qwen3.5-4B (three 4B launches on 2026-10-05 stalled
# at "Waiting for new policy..." after steps 1-4, Max Off-Policy 0)? Ten steps of the exact arm's
# training config on the 2B; no eval. Read: does latest_step pass 5, and does Max Off-Policy or a
# policy version move. Estimated cost under US$1.
name = "lc-probe-qwen2b"
model = "Qwen/Qwen3.5-2B"
max_steps = 10
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 1536
temperature = 1.0
enable_thinking = false

[[env]]
id = "carlos-toledo/lattice-claims"
version = "0.2.1"
args = { grader = "exact", dims = [8, 12, 16], num_tasks = 400, seed = 2026, eval_seed = 9999, eval_num_tasks = 1 }
