:root{--v-cert:#79C79B;--v-refu:#E06B62;--v-refd:#8E8499;--v-cert-soft:#16281E;--v-refu-soft:#2E1917;--v-refd-soft:#211C29}   /* --f-sans/--f-display/--f-mono and --shadow come from T.rootCss(), emitted just above */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit}
.as-map{position:fixed;inset:0}
.as-map canvas{outline:none}

/* ---- top bar ---- */
.as-top{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;
  gap:14px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--rule)}
.as-top .brand{font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.14em;
  color:var(--ink);text-decoration:none;white-space:nowrap}
.as-top .sep{width:1px;height:20px;background:var(--rule)}
.as-top .appname{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:14px;letter-spacing:.01em;color:var(--ink)}
.as-top .meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:var(--radius-pill);padding:3px 10px;white-space:nowrap}
.as-top .spacer{flex:1}
/* the mono cell, and the mono cell at book weight. Forty elements in the app's
   templates carried these two declarations inline; they are the app's type
   contract and belong where a restyle can reach them (2026-09-15). */
/* ---- THE APP'S SPACING AND FLOW, NAMED (2026-09-15) ----------------------
   Fifty elements in the two app pages carried their spacing inline — the
   product's own rhythm written where no restyle could reach it. Where the
   value is on design/tokens.js's SPACE scale it takes the token; where it is
   the app's own mark (2, 6, 10, 14px) it keeps the number, but in ONE place.
   The app is still a second BODY layout (DEBT.md row 4); it is no longer a
   second stylesheet. ---- */
.as-mt1{margin-top:var(--s-1)}
.as-mt2{margin-top:var(--s-2)}
.as-mt3{margin-top:var(--s-3)}
.as-mt4{margin-top:var(--s-4)}
.as-mt6{margin-top:6px}
.as-mt10{margin-top:10px}
.as-mt14{margin-top:14px}
.as-mb1{margin-bottom:var(--s-1)}
.as-mb2{margin-bottom:var(--s-2)}
.as-mb10{margin-bottom:10px}
.as-ml2{margin-left:var(--s-2)}
.as-my{margin:6px 0 4px}
.as-full{width:100%}
.as-grow{flex:1}
.as-row{display:flex;align-items:center;gap:var(--s-2)}
.as-row-wide{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-2)}
.as-track{width:100%;height:54px;display:block;background:var(--sunk);
  border:1px solid var(--rule-soft);border-radius:var(--radius-m);margin:10px 0 2px}
.as-spark{width:100%;height:38px;display:block;margin-bottom:2px}
.as-tracked{letter-spacing:.12em}
.as-cert{color:var(--v-cert)}
.as-refd{color:var(--v-refd)}
.as-refu{color:var(--v-refu)}
.as-ink3{color:var(--ink-3)}
.as-ink3-400{color:var(--ink-3);font-weight:var(--weight-body)}
.as-dash{border-style:dashed;border-color:var(--ink-3)}
.as-mono{font-family:var(--f-mono)}
.as-mono-400{font-family:var(--f-mono);font-weight:var(--weight-body)}
.as-top a.navx{color:var(--ink-2);text-decoration:none;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;padding:6px 2px;transition:color .12s}
.as-top a.navx:hover{color:var(--sig)}

/* ---- panels: right = tabbed workspace; left = the selected flight ---- */
.as-panel{position:fixed;top:68px;right:12px;bottom:92px;width:404px;z-index:20;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.as-left{position:fixed;top:68px;left:12px;bottom:92px;width:372px;z-index:21;overflow-y:auto;
  display:none;flex-direction:column;gap:10px;scrollbar-width:thin}
.as-left.open{display:flex}
.as-left.min{bottom:auto}
.as-left.min .as-card > *:not(.as-lhead){display:none}
.as-lhead{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
.as-left.min .as-lhead{margin:0}
.as-lhead .t{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.06em;flex:1}
.as-lhead button{width:24px;height:24px;border-radius:var(--radius-s);border:1px solid var(--rule);
  background:var(--sunk);color:var(--ink-2);cursor:pointer;font-size:12px;line-height:1;padding:0}
.as-lhead button:hover{border-color:var(--sig);color:var(--sig)}

/* ---- tab bar (right panel) ---- */
.as-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius-m);padding:4px;box-shadow:var(--shadow);flex:none}
.as-tabs button{flex:1;border:0;background:transparent;font-family:var(--f-mono);font-weight:600;
  font-size:11px;letter-spacing:.12em;color:var(--ink-3);padding:8px 0;border-radius:var(--radius-m);
  cursor:pointer;transition:all .15s}
.as-tabs button:hover{color:var(--sig)}
.as-tabs button[data-on="1"]{background:var(--sig-soft);color:var(--sig)}
.as-tabbody{display:none;flex-direction:column;gap:10px}
.as-tabbody.on{display:flex}

/* ---- annunciators (cockpit lozenge: binary states) ---- */
.as-ann{display:inline-flex;align-items:center;justify-content:center;min-width:64px;
  font-family:var(--f-mono);font-weight:700;font-size:11px;letter-spacing:.14em;
  padding:5px 10px;border-radius:var(--radius-s);border:1px solid}
.as-ann.go{color:var(--v-cert);border-color:var(--v-cert);background:var(--v-cert-soft)}
.as-ann.no{color:var(--v-refu);border-color:var(--v-refu);background:var(--v-refu-soft)}
.as-ann.na{color:var(--v-refd);border-color:var(--v-refd);background:var(--v-refd-soft)}

/* ---- arc gauge ---- */
.as-gauge{display:block;margin:0 auto}
.as-gauge .bg{stroke:var(--sunk);stroke-width:9;fill:none}
.as-gauge .fg{stroke:var(--v-cert);stroke-width:9;fill:none;stroke-linecap:round;
  transition:stroke-dashoffset .45s cubic-bezier(.4,0,.2,1)}
.as-gauge text{font-family:var(--f-mono);fill:var(--ink)}
.as-gaugelbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-3);
  text-transform:uppercase;text-align:center;margin-top:2px}

/* ---- fleet silhouettes ---- */
.as-fleet{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:30px}
.as-fleet svg{width:30px;height:30px;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.as-fleet svg.on{color:var(--sig)}
.as-fleet svg.off{color:var(--rule);transform:scale(.82)}

/* ---- battery pictogram ---- */
.as-batt{display:flex;align-items:center;gap:10px}
.as-batt .shell{position:relative;width:64px;height:26px;border:2px solid var(--rule);
  border-radius:5px;flex:none}
.as-batt .shell:after{content:'';position:absolute;right:-6px;top:7px;width:4px;height:8px;
  background:var(--rule);border-radius:0 2px 2px 0}
.as-batt .fill{position:absolute;inset:2px;border-radius:2px;background:var(--v-cert);
  transform-origin:left;transition:transform .3s,background .3s}
.as-routebadge{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3)}

/* ---- live mission ---- */
.as-dispatch{font-family:var(--f-mono);font-weight:700;font-size:11px;letter-spacing:.12em;
  color:var(--sig);border:1px solid var(--sig);background:var(--sig-soft);border-radius:var(--radius-s);
  padding:5px 12px;cursor:pointer;transition:all .15s}
.as-dispatch:hover{filter:brightness(1.15);transform:translateY(-1px)}
.as-dispatch[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.as-datablocks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
/* FULL-ROW RULE (design/template.js): the last row fills its tracks at any count.
   remainder 1 -> the last block spans 4; remainder 2 -> both span 2;
   remainder 3 -> the first of the three spans 2. */
.as-datablocks>:last-child:nth-child(4n+1){grid-column:span 4}
.as-datablocks>:nth-last-child(2):nth-child(4n+1),
.as-datablocks>:last-child:nth-child(4n+2),
.as-datablocks>:nth-last-child(3):nth-child(4n+1){grid-column:span 2}
.as-db{background:var(--sunk);border:1px solid var(--rule-soft);border-radius:var(--radius-m);padding:7px 9px}
.as-db span{display:block;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase}
.as-db b{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap}
.as-db.live b{color:var(--sig)}
.as-journey{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:600;
  font-size:12px;margin:6px 0 2px}
.as-journey .bar{flex:1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;
  border:1px solid var(--rule-soft)}
.as-journey .bar i{display:block;height:100%;background:var(--sig);border-radius:3px;
  transition:width .3s linear}
.as-missions{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--sig)}
.as-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-m);
  padding:14px 16px;box-shadow:var(--shadow)}
.as-h{font-family:var(--f-mono);font-weight:600;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.as-note{font-size:12px;color:var(--ink-2);line-height:1.55}
.as-note b{color:var(--ink);font-weight:600}
.as-fine{font-size:11px;color:var(--ink-3);line-height:1.5}
details.as-more summary{cursor:pointer;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-top:10px}
details.as-more summary:hover{color:var(--sig)}
details.as-more[open] summary{margin-bottom:6px}

/* ---- the aircraft x rule matrix ---- */
.as-mx{display:grid;grid-template-columns:1fr auto auto;gap:7px 8px;align-items:center}
.as-mx .name{font-weight:500;font-size:12.5px;color:var(--ink)}
.as-cell{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:5px 10px;
  border-radius:var(--radius-s);border:1px solid var(--rule);background:var(--sunk);color:var(--ink-2);
  cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.as-cell:hover{border-color:var(--sig-2);color:var(--sig)}
.as-cell[data-on="1"]{border-color:var(--sig);background:var(--sig-soft);color:var(--sig);font-weight:600}
.as-dot{width:7px;height:7px;border-radius:50%;flex:none}

.as-score{grid-column:1/-1;font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--ink);
  padding-bottom:2px}
.as-score span{font-family:var(--f-sans);font-weight:400;font-size:11.5px;color:var(--ink-3);margin-left:6px}
/* ---- stat tiles ---- */
.as-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* FULL-ROW RULE: remainder 1 -> last tile spans 3; remainder 2 -> first of the two spans 2 */
.as-stats>:last-child:nth-child(3n+1){grid-column:span 3}
.as-stats>:nth-last-child(2):nth-child(3n+1){grid-column:span 2}
.as-stat{background:var(--sunk);border:1px solid var(--rule-soft);border-radius:var(--radius-m);
  padding:9px 11px;border-left-width:3px}
/* the big number is always the signature pink (operator ruling 2026-08-31);
   the verdict stays on the tile's left border, never on the number */
.as-stat b{display:block;font-family:var(--f-mono);font-weight:600;font-size:20px;line-height:1.1;color:var(--sig)}
.as-stat span{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.as-stat.c{border-left-color:var(--v-cert)} .as-stat.r{border-left-color:var(--v-refu)} .as-stat.f{border-left-color:var(--v-refd)}

/* ---- frontier rows ---- */
.as-frow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;
  border-top:1px solid var(--rule-soft)}
.as-frow:first-of-type{border-top:0;padding-top:0}
.as-frow .name{font-weight:500;font-size:12.5px}
.as-frow .val{font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap}
.as-frow .val.zero{color:var(--ink-3);font-weight:400}
.as-frow .sub{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}

/* ---- selected flight ---- */
.as-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px;color:var(--ink-3)}
.as-kv b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:12px}
.as-verdict{border-left:3px solid var(--rule);background:var(--sunk);border-radius:var(--radius-m);
  padding:10px 13px;margin:12px 0 10px}
.as-verdict .w{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.08em}
.as-verdict .e{font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.as-verdict.C{border-left-color:var(--v-cert);background:var(--v-cert-soft)} .as-verdict.C .w{color:var(--v-cert)}
.as-verdict.R{border-left-color:var(--v-refu);background:var(--v-refu-soft)} .as-verdict.R .w{color:var(--v-refu)}
.as-verdict.F{border-left-color:var(--v-refd);background:var(--v-refd-soft)} .as-verdict.F .w{color:var(--v-refd)}

/* ---- enclosure viz ---- */
.as-enc{margin:10px 0 4px}
.as-encrow{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;margin:5px 0}
.as-encrow .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;text-align:right}
.as-encrow .track{position:relative;height:12px;background:var(--sunk);border:1px solid var(--rule-soft);border-radius:var(--radius-s)}
.as-encrow .band{position:absolute;top:1px;bottom:1px;border-radius:5px;min-width:4px}
.as-encrow .band.u{background:var(--v-cert)} .as-encrow .band.d{background:var(--v-refu)}
.as-encscale{display:grid;grid-template-columns:64px 1fr;gap:8px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3)}
.as-encscale div{display:flex;justify-content:space-between}
.as-encvals{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}

/* ---- buttons + segmented ---- */
button{font-family:inherit}
.as-btn{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;background:var(--sunk);
  color:var(--ink);border:1px solid var(--rule);border-radius:var(--radius-m);padding:7px 12px;cursor:pointer;transition:all .12s}
.as-btn:hover{border-color:var(--sig);color:var(--sig)}
.as-btn[data-on="1"]{border-color:var(--sig);color:var(--sig);background:var(--sig-soft)}
select.as-sel{font-family:var(--f-mono);font-size:11px;background:var(--sunk);color:var(--ink);
  border:1px solid var(--rule);border-radius:var(--radius-m);padding:6px 8px;color-scheme:dark;max-width:100%}
/* This select said color-scheme:light dark until 2026-09-05, and it was the last of the
   light theme still breathing. It tells the browser this <select> supports
   BOTH schemes, so on a light-OS machine the native dropdown POPUP — the part
   the page cannot style — rendered light inside a dark app. The palette above
   it was deleted on 2026-09-04; this line survived because design/battery.js's
   one-theme check only reads tokens.js's :root block and never saw this file. */
select.as-sel:hover{border-color:var(--sig)}
.as-seg{display:inline-flex;background:var(--sunk);border:1px solid var(--rule);border-radius:var(--radius-m);padding:2px;gap:2px}
.as-seg button{border:0;background:transparent;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:.04em;color:var(--ink-2);padding:5px 10px;border-radius:var(--radius-s);cursor:pointer;transition:all .12s}
.as-seg button:hover{color:var(--sig)}
.as-seg button[data-on="1"]{background:var(--sig-soft);color:var(--sig);font-weight:600}

/* ---- dock ---- */
.as-dock{position:fixed;left:0;right:0;bottom:0;height:76px;z-index:30;display:flex;align-items:center;
  gap:16px;padding:0 20px;background:var(--paper);border-top:1px solid var(--rule)}
.as-play{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--rule);
  background:var(--sunk);color:var(--ink);font-size:13px;cursor:pointer;transition:all .12s;
  display:flex;align-items:center;justify-content:center}
.as-play:hover{border-color:var(--sig);color:var(--sig)}
.as-clock{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--ink);min-width:96px;text-align:center}
.as-dock .attr{margin-left:auto;font-size:9.5px;color:var(--ink-3);text-align:right;line-height:1.4;max-width:220px}
.as-dock .attr a{color:var(--ink-3)}

/* ---- the scrubber ---- */
input[type=range].as-scrub{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:26px;background:transparent;cursor:pointer}
.as-scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--rule)}
.as-scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--sig);margin-top:-5px;border:2px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.as-scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--rule)}
.as-scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--sig);border:2px solid var(--paper)}

.maplibregl-ctrl-attrib{font-size:10px}
/* THE MAP CONTROLS WERE THE LAST WHITE THING IN A DARK APP (2026-09-05).
   src/app.js adds a NavigationControl at top-left, and maplibre styles its own
   controls for a light page: the ctrl-group background is hard-coded white in
   the vendored stylesheet, with dark glyphs to sit on it. Nothing here
   ever overrode it, so a white rounded box with a dark compass needle sat on the
   dark map — the defect logged as D-1 in VISUAL-REVIEW-2026-09-05.md, which I
   had guessed was a stray element and which turns out to be third-party CSS
   assuming a light ground.

   The group takes app tokens; the glyphs are inverted rather than re-encoded,
   because both of maplibre's icon sets are dark-on-transparent (the default
   fills a dark grey, the light-scheme branch fills black by omission).
   Inverting either gives a light glyph, so the control is dark on every OS.
   The only residue is a shade of glyph brightness by system — both correct for
   a dark app, and not worth forking a vendor file over.

   AND NO LITERAL COLOURS IN HERE: this comment ships INTO the page, because it
   sits inside a template literal, and check-wiring reads built pages for hex
   outside the palette. It caught this comment on its first run. */
.maplibregl-ctrl-group{background:var(--sunk);border:1px solid var(--rule);
  border-radius:var(--radius-m);box-shadow:none;overflow:hidden}
.maplibregl-ctrl-group button{background:transparent}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--rule)}
.maplibregl-ctrl-group button:hover{background:var(--surface)}
.maplibregl-ctrl-group button:not(:disabled) .maplibregl-ctrl-icon{filter:invert(1) opacity(.78)}
.maplibregl-ctrl-group button:disabled .maplibregl-ctrl-icon{filter:invert(1) opacity(.3)}
.as-panel::-webkit-scrollbar{width:6px}
.as-panel::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}

@media (max-width:720px){
  .as-top{height:48px;padding:0 12px;gap:10px}
  .as-top .appname{font-size:12.5px}
  .as-top .meta,.as-top .navx{display:none}
  .as-panel{left:8px;right:8px;top:auto;bottom:88px;width:auto;max-height:44dvh;gap:8px}
  .as-left{left:8px;right:8px;top:auto;bottom:88px;width:auto;max-height:52dvh;z-index:24}
  .as-card{padding:12px 13px;border-radius:var(--radius-m)}
  .as-dock{gap:9px;padding:0 10px;height:64px}
  .as-play{width:36px;height:36px}
  .as-clock{min-width:78px;font-size:12.5px}
  .as-dock .attr{display:none}
  #speed{display:none}
  .as-seg button{padding:5px 8px;font-size:10px}
}

:root{--sw-rail:404px;--sw-peek:252px;--sw-top:56px;--sw-gap:14px;--sw-e:cubic-bezier(.2,.8,.2,1);--sw-e2:cubic-bezier(.16,1,.3,1);
  --sw-panel:color-mix(in srgb,var(--paper) 92%,transparent)}
@media (max-width:720px){:root{--sw-top:48px}}
button{font:inherit;color:inherit}
.sw-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font:500 12.5px/1 var(--f-sans);color:var(--ink-3);
  padding:8px 11px;border-radius:9px;white-space:nowrap;transition:background .18s var(--sw-e),color .18s var(--sw-e)}
.sw-btn:hover{color:var(--ink);background:var(--surface2)}
.sw-btn.on{color:var(--ink);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--rule-strong)}
:focus-visible{outline:1.5px solid var(--ink-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---- the top bar (the shell's), Swell's controls in it ---- */
.sw-topctl{display:flex;align-items:center;gap:6px;margin-left:8px}
.sw-lang{display:flex;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule-strong)}
.sw-lang button{all:unset;cursor:pointer;font:600 11px/1 var(--f-mono);padding:8px 9px;color:var(--ink-4)}
.sw-lang button.on{color:var(--paper);background:var(--ink)}
#sw-sos{color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-strong)}
@media (max-width:899px){.sw-topctl .sw-btn span{display:none}.sw-topctl .sw-btn{padding:8px}}

/* ---- the intro, while the day arrives ---- */
#sw-intro{position:fixed;inset:0;z-index:40;background:var(--paper);display:grid;place-items:center;transition:opacity .7s var(--sw-e),visibility .7s}
#sw-intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#sw-intro .mark{display:grid;justify-items:center;gap:18px;transform:translateY(-4vh)}
#sw-intro .word{font:600 clamp(28px,5vw,44px)/1 var(--f-sans);letter-spacing:.34em;margin-left:.34em;color:var(--ink)}
#sw-intro .line{width:min(60vw,420px);height:28px;overflow:hidden}
#sw-intro .line svg{width:100%;height:100%;display:block}
#sw-intro .line path{fill:none;stroke:var(--ink-3);stroke-width:1.2;animation:sw-crest 2.6s ease-in-out infinite}
@keyframes sw-crest{0%,100%{opacity:.25}50%{opacity:1}}
#sw-intro .sub{font:400 13px/1.5 var(--f-sans);color:var(--ink-4);text-align:center;max-width:38ch}

/* ---- the map and what is drawn over it ---- */
canvas#sw-windfx,canvas#sw-flowfx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
.maplibregl-ctrl-bottom-left{left:var(--sw-gap);bottom:10px}
.maplibregl-ctrl-attrib{background:color-mix(in srgb,var(--paper) 70%,transparent)!important;color:var(--ink-4);font:10px var(--f-sans);border-radius:6px}
.maplibregl-ctrl-attrib a{color:var(--ink-4)}
.maplibregl-marker{z-index:2}
.sw-bl{display:flex;align-items:center;gap:6px;cursor:pointer;font:600 11.5px/1 var(--f-sans);color:var(--ink);
  text-shadow:0 1px 3px var(--paper),0 0 10px var(--paper);white-space:nowrap;transition:opacity .2s}
.sw-bl i.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);box-shadow:0 0 0 1.5px var(--paper);flex:none}
.sw-bl[data-v="good"] i.dot{background:var(--ink);box-shadow:0 0 0 1.5px var(--paper),0 0 0 4px color-mix(in srgb,var(--ink) 22%,transparent)}
.sw-bl[data-v="fair"] i.dot{background:transparent;box-shadow:inset 0 0 0 2px var(--ink),0 0 0 1.5px var(--paper)}
.sw-bl[data-d="V"] i.dot{width:0;height:0;border-radius:0;background:none;box-shadow:none;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid var(--v-refu)}
.sw-bl[data-d="I"] i.dot{background:transparent;box-shadow:inset 0 0 0 2px var(--v-refd),0 0 0 1.5px var(--paper)}
.sw-bl[data-r="1"] i.dot{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-4)}
.sw-bl .ic{display:flex;gap:3px;margin-left:1px}
.sw-bl .ic b,.sw-mini b{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 88%,transparent);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.sw-bl .ic b.good,.sw-mini b.good{background:var(--ink);color:var(--paper);box-shadow:none}
.sw-bl .ic b.fair,.sw-mini b.fair{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.sw-bl .ic b.V,.sw-mini b.V{color:var(--v-refu);box-shadow:inset 0 0 0 1.5px var(--v-refu);background:var(--v-refu-soft)}
.sw-bl .ic b.I,.sw-mini b.I{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--v-refd)}
.sw-bl.off{opacity:.55}.sw-bl.off .nm{font-weight:500;color:var(--ink-2)}
.sw-bl.sel .nm{text-decoration:underline;text-underline-offset:3px}
.sw-bl.hidden{opacity:0;pointer-events:none}
body.z-far .sw-bl:not(.sel) .nm,body.z-far .sw-bl .ic b:not(:first-child){display:none}
body.z-far .sw-bl .ic b{width:16px;height:16px}
body:not(.z-near):not(.z-far) .sw-bl .ic b:nth-child(n+4){display:none}
.sw-poi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--surface);color:var(--ink-2);box-shadow:0 0 0 1px var(--rule-strong)}
.sw-poi-lifeguard{color:var(--ink);background:var(--surface2);box-shadow:0 0 0 1.5px var(--ink-3)}
body.z-far .sw-poi,body.pois-off .sw-poi,body:not(.z-near) .sw-poi-police,body:not(.z-near) .sw-poi-ramp,body:not(.z-near) .sw-poi-marina,body:not(.z-near) .sw-poi-health,body:not(.z-near) .sw-poi-fire{display:none}
.sw-pop .maplibregl-popup-content{background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);border-radius:10px;padding:10px 28px 10px 12px;font:12.5px/1.45 var(--f-sans);display:grid;gap:2px}
.sw-pop .maplibregl-popup-content span{color:var(--ink-3)}
.sw-pop .maplibregl-popup-tip{border-top-color:var(--surface)!important;border-bottom-color:var(--surface)!important}

/* ---- the panel: a rail (desk), a sheet (phone) — overrides the shell's .as-panel ---- */
#panel.as-panel{position:fixed;z-index:25;background:var(--sw-panel);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
  border:1px solid var(--rule);display:flex;flex-direction:column;box-shadow:var(--shadow);padding:0;gap:0;overflow:hidden;max-height:none}
.sw-grab{display:none}
.sw-phead{padding:18px 20px 6px;flex:none}
#sw-answer{font:500 17px/1.38 var(--f-sans);letter-spacing:-.012em;color:var(--ink-2);margin:0 0 14px;min-height:calc(1.38em * 2)}
#sw-answer b{color:var(--ink);font-weight:600}
#sw-answer .dec{font:600 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--v-refu);white-space:nowrap}
#sw-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 0 8px;height:44px}
#sw-days button{all:unset;cursor:pointer;text-align:center;padding:7px 2px 0;border-radius:9px;color:var(--ink-3);font:500 11.5px/1 var(--f-sans);white-space:nowrap;overflow:hidden}
#sw-days button:hover{color:var(--ink)}
#sw-days button i{display:block;height:3px;margin:8px auto 0;width:68%;border-radius:2px;background:var(--rule-strong)}
#sw-days button i b{display:block;height:100%;border-radius:2px;background:var(--ink-4)}
#sw-days button.on{color:var(--ink);background:var(--surface2)}
#sw-days button.on i b{background:var(--ink)}
.sw-hourrow{display:grid;grid-template-columns:1fr 52px auto;gap:10px;align-items:center;height:42px}
.sw-scrub{position:relative;height:36px}
#sw-daystrip{position:absolute;left:0;right:0;top:0;width:100%;height:20px}
#sw-hour{position:absolute;left:0;right:0;bottom:2px;width:100%;margin:0;-webkit-appearance:none;appearance:none;height:14px;background:transparent;cursor:ew-resize}
#sw-hour::-webkit-slider-runnable-track{height:2px;background:var(--rule-strong);border-radius:1px}
#sw-hour::-moz-range-track{height:2px;background:var(--rule-strong);border-radius:1px}
#sw-hour::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-6px;box-shadow:0 0 0 3px var(--paper)}
#sw-hour::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--paper)}
#sw-hour-v{font:600 12.5px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.sw-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--rule);flex:none;position:relative}
.sw-tab{all:unset;cursor:pointer;position:relative;padding:11px 10px 12px;font:500 12.5px/1 var(--f-sans);color:var(--ink-4);display:inline-flex;align-items:center;gap:7px}
.sw-tab:hover{color:var(--ink-2)}
.sw-tab.on{color:var(--ink)}
.sw-tab .ct{font:500 10px var(--f-mono);color:var(--ink-5);padding:2px 5px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--rule-strong)}
.sw-tab.on .ct{color:var(--ink-3)}
.sw-tabs .ul{position:absolute;bottom:-1px;height:2px;background:var(--ink);border-radius:1px;transition:left .3s var(--sw-e2),width .3s var(--sw-e2)}
.sw-scroll{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 20px;flex:1;scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent}
.sw-pane{display:none}
.sw-pane.on{display:block}
h2.sw-sec{font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);margin:18px 0 10px;display:flex;align-items:center;gap:10px}
h2.sw-sec::after{content:'';flex:1;height:1px;background:var(--rule)}
.sw-filter{display:flex;gap:3px;padding:12px 0 4px;flex-wrap:wrap}
.sw-fl{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 9px;border-radius:9px;color:var(--ink-3);font:550 12px/1 var(--f-sans)}
.sw-fl:hover{color:var(--ink);background:var(--surface2)}
.sw-fl.on{color:var(--paper);background:var(--ink)}
.sw-fl span{display:none}.sw-fl.on span{display:inline}

/* the list */
#sw-rank ol{list-style:none;margin:0;padding:0}
#sw-rank li{display:grid;grid-template-columns:18px 1fr auto;gap:2px 10px;align-items:baseline;padding:11px 10px 10px;margin:0 -10px;border-radius:12px;cursor:pointer}
#sw-rank li:hover{background:var(--surface2)}
#sw-rank li .n{font:500 11px var(--f-mono);color:var(--ink-4)}
#sw-rank li .b{font:580 14.5px/1.25 var(--f-sans);letter-spacing:-.01em;color:var(--ink)}
#sw-rank li .b small{display:block;font:450 11px var(--f-sans);color:var(--ink-4);margin-top:2px}
#sw-rank li .h{font:600 15px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
#sw-rank li .h small{display:block;font:500 10px var(--f-mono);color:var(--ink-4);margin-top:2px}
#sw-rank li .d{grid-column:2 / 4;font:12px/1.3 var(--f-sans);color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
#sw-rank li .d .sp{flex:1}
#sw-rank li.refused .h{color:var(--ink-4)}
.sw-mini{display:inline-flex;gap:3px}
.sw-mini b{width:18px;height:18px}
.sw-spark{display:block;width:100%;height:16px;margin-top:6px;grid-column:2 / 4;opacity:.9}

/* forecast words: sans, lower case, grayscale */
.sw-chip{font:550 11px/1 var(--f-sans);padding:4px 7px;border-radius:5px;white-space:nowrap}
.sw-chip.good{background:var(--ink);color:var(--paper)}
.sw-chip.fair{box-shadow:inset 0 0 0 1px var(--ink-3);color:var(--ink)}
.sw-chip.poor,.sw-chip.flat,.sw-chip.none{color:var(--ink-4);box-shadow:inset 0 0 0 1px var(--rule-strong)}
/* a forecast WARNING: dashed (assumed), never solid */
.sw-fw{font:550 11px/1 var(--f-sans);padding:3px 6px;border-radius:5px;white-space:nowrap;color:var(--ink-2);border:1px dashed var(--ink-3)}
/* DECIDED: solid, upper-case mono, the verdict tokens */
.sw-dec{font:650 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:4px;white-space:nowrap}
.sw-dec.V{color:var(--v-refu);background:var(--v-refu-soft);box-shadow:inset 0 0 0 1.5px var(--v-refu)}
.sw-dec.V::before{content:'▲ ';font-size:8px}
.sw-dec.I{color:var(--ink);background:var(--v-refd-soft);box-shadow:inset 0 0 0 1.5px var(--v-refd)}
.sw-dec.L{color:var(--v-cert);box-shadow:inset 0 0 0 1px var(--v-cert);background:transparent}
.sw-dec.R,.sw-dec.S{color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule-strong)}

/* your beaches */
.sw-fav{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;box-sizing:border-box;padding:9px 10px;margin:0 -10px 2px;border-radius:10px}
.sw-fav:hover{background:var(--surface2)}
.sw-fav .b{font:560 13.5px var(--f-sans);color:var(--ink)}.sw-fav .w{grid-column:1;font:12px var(--f-sans);color:var(--ink-3)}

/* a beach */
#sw-card[hidden],#sw-rank[hidden],#sw-favs[hidden]{display:none}
.sw-back{margin:10px -11px 2px}
#sw-card .head{display:flex;align-items:center;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
#sw-card h1{font:620 26px/1.08 var(--f-sans);letter-spacing:-.025em;margin:0;flex:1;color:var(--ink)}
#sw-card .where{font:12px var(--f-sans);color:var(--ink-4)}
#sw-card .acts-here{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
#sw-card .ah{all:unset;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 6px;border-radius:13px;font:550 11.5px/1 var(--f-sans);color:var(--ink-4);box-shadow:inset 0 0 0 1px var(--rule-strong);cursor:pointer}
#sw-card .ah.good{color:var(--paper);background:var(--ink);box-shadow:none}
#sw-card .ah.fair{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-2)}
#sw-card .ah.V{color:var(--v-refu);box-shadow:inset 0 0 0 1.5px var(--v-refu);background:var(--v-refu-soft)}
#sw-card .ah.sel{outline:1.5px solid var(--ink-2);outline-offset:2px}
#sw-card .big{display:flex;align-items:flex-end;gap:14px;margin:16px 0 4px}
#sw-card .big b{font:600 46px/0.9 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
#sw-card .big span{font:12.5px/1.45 var(--f-sans);color:var(--ink-3)}
#sw-card .band{font:12px/1.5 var(--f-sans);color:var(--ink-3);margin:2px 0 0}
#sw-card .band b{font:600 12px var(--f-mono);color:var(--ink)}

ps/swell/data/tiles/floripa.pmtiles","local":"tiles/floripa.pmtiles","sha256":"9a3018af839f515ce9bbd274d0716c2de0ea8b9a48cb5a67a1531bd8c702c6db","attribution":"\u003ca href=\"https://openstreetmap.org/copyright\">© OpenStreetMap\u003c/a> · \u003ca href=\"https://protomaps.com\">Protomaps\u003c/a>"},"credit":"ECMWF open data (CC BY 4.0) · NOAA · E.U. Copernicus Marine Service Information · carta DHN 1902 (não comercial, não serve para navegação)","dataAt":"825e523e40a07962753182169543eccb60cb27cc","how":{"pt":"\n\u003ch3>O que é\u003c/h3>\n\u003cp>Para 34 praias de Florianópolis e seis jeitos de usar o mar, onde e quando está bom nos próximos 7 dias — e, separado, o que está \u003cb>decidido\u003c/b> e o que é só \u003cb>previsão\u003c/b>. Swell parte do mar aberto na borda leste da ilha: a previsão do ECMWF e da NOAA, lida uma vez por dia (rodada das 00 UTC, de 3 em 3 horas), com o \u003cb>erro medido por satélite\u003c/b>. Um modelo das ondas da ilha inteira, sobre o fundo do mar da carta náutica 1902 da Marinha, leva cada ondulação até cada praia: dobra nas pontas, cresce no raso, perde força atrás das pontas e quebra.\u003c/p>\n\u003ch3>O que é decidido\u003c/h3>\n\u003cp>Só os limites de ondas, e sempre sobre a \u003cb>faixa medida\u003c/b>. A faixa do mar aberto vem do erro que os satélites mediram nesta borda (427 passagens a 24 h de antecedência, 2023–2026, a faixa promete 388 de 428); a usada é a união da faixa do ECMWF com a da NOAA, que nos 15 meses de teste que nunca viu cobriu 96,5% de 21.259 medições de satélite. O modelo da ilha leva as duas bordas da faixa até cada praia (a altura de quebra cresce com o mar, então a faixa da praia é exata sobre o modelo). Se mesmo a borda baixa passa do limite: \u003cb>PERIGO\u003c/b>, decidido. Se a faixa cruza o limite: \u003cb>ATENÇÃO\u003c/b>, com quanto falta para virar. Se a faixa toda fica abaixo: abaixo do limite — o que \u003cb>não quer dizer seguro\u003c/b>.\u003c/p>\n\u003cp>A conta é refeita no seu navegador com os mesmos arquivos que fizeram o dia publicado, e o resultado é comparado com ele (um sha256 sobre cada altura e cada decisão). O certificado de cada praia e horário pode ser baixado e refeito por qualquer um.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Atividade\u003c/th>\u003cth>A regra\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Surfe\u003c/td>\u003ctd>Ondas entre 0,3 e 2,6 m na arrebentação, melhor com período longo e vento terral; acima de 2,6 m: grande demais (decidido sobre a faixa).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kite\u003c/td>\u003ctd>Vento de 11 a 34 nós, de lado ou do mar, sem rajadas muito acima da média; vento terral de 11 nós ou mais leva para o mar (aviso de previsão).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SUP\u003c/td>\u003ctd>Água lisa: ondas abaixo de 0,15–0,5 m e vento abaixo de 3–7 m/s; acima de 1,0 m na arrebentação: ondas fortes (decidido); vento terral acima de 18 km/h leva para o mar (aviso de previsão).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Banho\u003c/td>\u003ctd>Ondas abaixo de 0,35–1,1 m, pouco vento e pouca corrente; acima de 1,4 m na arrebentação: perigo (decidido sobre a faixa); ondas acima de 0,9 m chegando de frente numa praia de areia: corrente de retorno provável (regra prática). Nade perto de um posto de guarda-vidas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pesca\u003c/td>\u003ctd>Um pouco de mar (0,15–1,8 m) e vento abaixo de 6–10 m/s; acima de 2,0 m na arrebentação: perigo nas pedras (decidido sobre a faixa).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Barco\u003c/td>\u003ctd>Mar aberto abaixo de 1,2–2,2 m, vento abaixo de 7–12 m/s e pouca arrebentação para sair; mar aberto acima de 2,5 m: mar grosso (decidido sobre a faixa medida); vento acima de 13 m/s (25 nós): vento forte (aviso de previsão).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>O que é previsão\u003c/h3>\n\u003cp>O \u003cb>vento\u003c/b> (ECMWF a 10 m, na grade sobre a ilha: o erro dele nas praias ainda não foi medido), a nota que ordena as praias, as correntes ao longo da praia (pela altura e o ângulo das ondas), o risco de corrente de retorno (regra prática), a marola das baías (do vento), a maré e a temperatura da água (Copernicus). Avisos de previsão aparecem com borda tracejada; o que é decidido, com borda cheia e em maiúsculas.\u003c/p>\n\u003ch3>O modelo das praias\u003c/h3>\n\u003cp>64 casos (16 direções × 4 períodos, 6 a 15 s) sobre uma grade de 30 m da ilha inteira: refração, empinamento e abrigo, linear. Em cada praia a altura é lida em sondas de 1 a 9–13 m de fundo; a onda quebra onde chega a 0,55 vez a profundidade, marchando do fundo para a beira (e o maior valor de uma sonda da zona de arrebentação, quando um trecho da praia concentra a ondulação). No Swell original as sondas paravam em 4,5–6,5 m e 14 das 21 praias de mar aberto nunca passavam de 2,5 m, qualquer que fosse o mar; agora o limite é de 4,9 a 7,2 m.\u003c/p>\n\u003ch3>Limites\u003c/h3>\n\u003cp>O erro do próprio modelo da ilha na beira \u003cb>não foi medido\u003c/b> (falta uma medida na praia: uma boia ou uma câmera). Os bancos de areia de hoje não estão no fundo do mar; até 10 m de fundo o perfil é ajustado à linha de 10 m da carta. \u003cb>Guarda do Embaú\u003c/b> fica a 0,6 km da borda do modelo e é \u003cb>recusada\u003c/b>: ali a onda que entra pela borda ainda não dobrou no fundo. O mar de vento mais curto que 6 s é lido como o caso de 6 s; uma ondulação mais longa que 15 s é lida como 15 s e avisada no cartão da praia. Só contam as horas de luz. Não serve para navegação.\u003c/p>\n\u003ch3>Fontes\u003c/h3>\n\u003cp>Mar e vento: ECMWF open data (CC BY 4.0) e NOAA WAVEWATCH III / GFS-Wave (domínio público). Erro medido: satélites altímetros (NOAA RADS), as faixas calibradas do Janela no ponto da borda da ilha. Maré e temperatura da água: Generated using E.U. Copernicus Marine Service Information (doi:10.48670/moi-00016). Fundo do mar: carta náutica 1902 da Marinha do Brasil (DHN/CHM; uso não comercial, não serve para navegação) e GMRT (CC BY 4.0). Mapa e locais: © OpenStreetMap, Protomaps. Modelo da ilha: o Swell original (frontier-apps), com os mesmos 64 casos. Código (MIT): \u003ca href=\"https://github.com/carlostoledo1891/cert-machine/tree/main/apps/swell\">apps/swell\u003c/a>.\u003c/p>","en":"\n\u003ch3>What it is\u003c/h3>\n\u003cp>For 34 beaches of Florianópolis and six ways of using the sea: where and when it is good over the next 7 days — and, kept apart, what is \u003cb>decided\u003c/b> and what is only \u003cb>forecast\u003c/b>. Swell starts from the open sea at the island's eastern edge: ECMWF's and NOAA's forecast, read once a day (the 00 UTC run, every 3 hours), with its \u003cb>error measured by satellites\u003c/b>. A wave model of the whole island, over the seafloor of the Brazilian Navy's chart 1902, carries each swell to each beach: it bends round the headlands, grows in the shallows, fades behind them and breaks.\u003c/p>\n\u003ch3>What is decided\u003c/h3>\n\u003cp>Only the wave limits, and always over the \u003cb>measured band\u003c/b>. The open sea's band comes from the error the satellites measured at this edge (427 passes at 24 h lead, 2023–2026, the band claims 388 of 428); the one used is the union of ECMWF's band and NOAA's, which over the 15 test months it never saw covered 96.5% of 21,259 satellite measurements. The island model carries both edges of the band to each beach (the breaking height grows with the sea, so the beach's band is exact over the model). If even the low edge is over the limit: \u003cb>DANGER\u003c/b>, decided. If the band straddles it: \u003cb>CAUTION\u003c/b>, with how far it is from turning. If the whole band is under it: under the limit — which \u003cb>does not mean safe\u003c/b>.\u003c/p>\n\u003cp>The arithmetic is redone in your browser with the same files that made the published day, and compared with it (a sha256 over every height and every decision). Each beach and hour's certificate can be downloaded and redone by anyone.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Activity\u003c/th>\u003cth>The rule\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Surf\u003c/td>\u003ctd>Breaking waves between 0.3 and 2.6 m, best with a long period and an offshore wind; above 2.6 m: too big (decided over the band).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kite\u003c/td>\u003ctd>Wind from 11 to 34 knots, side- or onshore, without gusts far above the mean; an offshore wind of 11 knots or more blows you out to sea (forecast warning).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SUP\u003c/td>\u003ctd>Flat water: waves under 0.15–0.5 m and wind under 3–7 m/s; above 1.0 m breaking: heavy surf (decided); an offshore wind above 18 km/h blows you out to sea (forecast warning).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Swim\u003c/td>\u003ctd>Waves under 0.35–1.1 m, little wind and little current; above 1.4 m breaking: danger (decided over the band); waves over 0.9 m arriving square to a sandy beach: rip current likely (rule of thumb). Swim near a lifeguard post.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fish\u003c/td>\u003ctd>Some sea (0.15–1.8 m) and wind under 6–10 m/s; above 2.0 m breaking: danger on the rocks (decided over the band).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Boat\u003c/td>\u003ctd>Open sea under 1.2–2.2 m, wind under 7–12 m/s and little surf to launch through; open sea above 2.5 m: rough (decided over the measured band); wind above 13 m/s (25 knots): strong wind (forecast warning).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>What is forecast\u003c/h3>\n\u003cp>The \u003cb>wind\u003c/b> (ECMWF at 10 m, on the grid over the island: its error at the beaches has not been measured yet), the score that ranks the beaches, the longshore currents (from the waves' height and angle), the rip-current risk (a rule of thumb), the bays' chop (from the wind), the tide and the water temperature (Copernicus). Forecast warnings carry a dashed border; what is decided, a solid one and capitals.\u003c/p>\n\u003ch3>The beach model\u003c/h3>\n\u003cp>64 cases (16 directions × 4 periods, 6 to 15 s) on a 30 m grid of the whole island: refraction, shoaling and shelter, linear. At each beach the height is read at probes from 1 to 9–13 m deep; the wave breaks where it reaches 0.55 times the depth, marching in from deep water (and the largest value at a surf-zone probe, where one stretch of the beach focuses the swell). In the original Swell the probes stopped at 4.5–6.5 m and 14 of the 21 open-sea beaches could never read more than 2.5 m whatever the sea did; the limit is now 4.9 to 7.2 m.\u003c/p>\n\u003ch3>Limits\u003c/h3>\n\u003cp>The island model's own error at the shore \u003cb>has not been measured\u003c/b> (a measurement at the beach is missing: a buoy or a camera). Today's sandbars are not in the seafloor; inside 10 m the profile is fitted to the chart's 10 m line. \u003cb>Guarda do Embaú\u003c/b> lies 0.6 km from the model's edge and is \u003cb>refused\u003c/b>: there the wave entering through the edge has not yet bent over the seafloor. A wind sea shorter than 6 s is read as the 6 s case; a swell longer than 15 s is read as 15 s and flagged on the beach's card. Only daylight hours count. Not for navigation.\u003c/p>\n\u003ch3>Sources\u003c/h3>\n\u003cp>Sea and wind: ECMWF open data (CC BY 4.0) and NOAA WAVEWATCH III / GFS-Wave (public domain). Measured error: satellite altimeters (NOAA RADS), Janela's calibrated bands at the island-edge point. Tide and water temperature: Generated using E.U. Copernicus Marine Service Information (doi:10.48670/moi-00016). Seafloor: Brazilian Navy chart 1902 (DHN/CHM; non-commercial use, not for navigation) and GMRT (CC BY 4.0). Map and places: © OpenStreetMap, Protomaps. Island model: the original Swell (frontier-apps), the same 64 cases. Code (MIT): \u003ca href=\"https://github.com/carlostoledo1891/cert-machine/tree/main/apps/swell\">apps/swell\u003c/a>.\u003c/p>"},"boardIntro":{"pt":"\u003cp>O placar do mar aberto de onde o Swell parte: cada dia, antes de acontecer, a faixa de cada previsão é gravada num registro que só cresce (certs/janela-ledger), e os satélites a conferem três dias depois. Uma faixa que promete 9 de 10 e erra mais do que isso deixa de decidir.\u003c/p>\u003cp>O que já está medido: nos 15 meses de teste que nunca viu, a faixa que decide (ECMWF ∪ NOAA) cobriu \u003cb>96,5%\u003c/b> de 21.259 medições de satélite (todas as áreas medidas do Janela). Nesta borda da ilha, a faixa do ECMWF foi cortada de 427 pares a 24 h.\u003c/p>\u003ch3>Nesta borda da ilha, ao vivo\u003c/h3>","en":"\u003cp>The scoreboard of the open sea Swell starts from: every day, before it happens, each forecast's band is written to an append-only record (certs/janela-ledger), and the satellites check it three days later. A band that claims 9 in 10 and misses more than that stops deciding.\u003c/p>\u003cp>What is already measured: over the 15 test months it never saw, the deciding band (ECMWF ∪ NOAA) covered \u003cb>96.5%\u003c/b> of 21,259 satellite measurements (every site Janela measures). At this island edge, ECMWF's band was cut from 427 pairs at 24 h.\u003c/p>\u003ch3>At this island edge, live\u003c/h3>"},"boardFoot":{"pt":"\u003cp class=\"sw-note\">As primeiras medidas ao vivo chegam três dias depois de cada previsão (as primeiras em 9 de outubro de 2026). A altura na beira de cada praia ainda não tem medida: o placar é do mar aberto.\u003c/p>","en":"\u003cp class=\"sw-note\">The first live scores arrive three days after each forecast (the first on 9 October 2026). The height at each beach has no measurement yet: the scoreboard is the open sea's.\u003c/p>"},"shas":{"app.js":"d0c30863faed96a40b86ee4137c8fb46c92dc3d098d9e2152f97e3caff0c5697","model.js":"4518661f33d285cc543315e84aeb06d4099d2995c4162a9bc6cef97c018032f3","early.js":"e672edfd44de07e4e233c4dbdd3f532ccccf18b58e82234a141be7b49d68b07b"}};</script>
