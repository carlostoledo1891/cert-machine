# Verify Gym GRPO pilot, the REPLICATE (notes/verify-gym-preregistration-2026-10-31.md, deviation 4): identical to
# pilot-qwen9b-s0.toml except that the training rows start at row 5000 of the v0 stage.
# Launch: prime train <this file> -y
name = "vg-pilot-qwen9b-s5000"
model = "Qwen/Qwen3.5-9B"
max_steps = 12
batch_size = 64
rollouts_per_example = 8

[sampling]
max_tokens = 16384
temperature = 1.0
enable_thinking = false

[[env]]
id = "carlos-toledo/verify-gym"
version = "0.1.0"
args = { num_tasks = 2400, start = 5000, stage = "v0", eval_split = "heldout" }

[eval]
interval = 12
num_examples = 120
rollouts_per_example = 8
skip_first_step = true

[eval.sampling]
max_tokens = 16384
temperature = 1.0
enable_thinking = false

[[eval.env]]
id = "carlos-toledo/verify-gym"
version = "0.1.0"
args = { num_tasks = 8, start = 5000, stage = "v0", eval_split = "heldout" }
