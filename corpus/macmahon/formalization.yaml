status:
  scope: >-
    Minimum size twelve, exactly ten labelled minimum inventories, the two-triangle
    characterization, and absence of repeated varieties at the minimum are proved.
    Geometry is modeled discretely by the six coordinate face directions and
    determinant-positive signed-axis permutations. The thirty tableau varieties,
    all 720 face assignments, corner matching, and 300 construction witnesses are
    checked. The target-count histograms for sizes eight through thirteen and the
    minimum size for exactly twenty-nine targets are computational results in the
    paper, not formalized theorems. No square-tiling claims are included.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
