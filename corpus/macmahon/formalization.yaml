version: "v0.4"
project:
  name: "The ten minimum universal sets of MacMahon cubes"
  description: >-
    A universal inventory of six-coloured MacMahon cubes can build a 2 by 2 by 2
    model of every target variety, using eight distinct physical copies, without
    requiring internal face colours to match. We prove that the minimum inventory
    size is twelve and classify all ten labelled inventories attaining it, even
    when repetitions are allowed. They are exactly the two-triangle sets in
    Conway's tableau. The proof derives row and column sums of two from usability
    inequalities, proves symmetry, and eliminates every other degree-two inventory
    by corner coverage. Finite kernel-checked witnesses establish sufficiency.
    The formalization also verifies the proper cube rotations, outward faces,
    and completeness and uniqueness of the thirty geometric representatives.
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"
