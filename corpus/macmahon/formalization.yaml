fidelity:
  divergences: >-
    The source conjecture concerns sets of distinct varieties. The theorem is
    stronger: arbitrary natural-number multiplicities are allowed and minimum
    inventories are proved to contain no repeats. Counts use fixed face-colour
    labels, not equivalence under colour permutations. Cube varieties identify
    proper rotations, not reflections. Only exterior faces must match. The
    geometric model is finite signed-axis geometry, not a development of Euclidean
    solids in real coordinates. The formal proof uses a different route from the
    written support-graph and general construction arguments. After the symbolic
    row-sum reduction, the classification uses label permutations to normalize
    the first row. Arithmetic proofs exclude a doubled
    edge and force two neighbours to close a triangle; the degree equations then
    determine both triangles. Sufficiency checks explicit witnesses for all 300
    minimum-set-target pairs. No generated classification branches are used.
