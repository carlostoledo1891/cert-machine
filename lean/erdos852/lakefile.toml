name = "erdos852"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Erdos852"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
# this is not a Mathlib contribution; its style linter has nothing to hold here
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Erdos852"
