# The MacMahon classification, the kernel lane: github.com/jasondavies/macmahon-min-universal-sets at the commit the Palomar
# registry names (d8856c9; Lean v4.35.0, Mathlib v4.35.0), built with its own toolchain and audited with leanprover/comparator
# at the tag that matches that toolchain, on the configuration the repository SHIPS (comparator.json: Challenge.lean states
# the ten theorems with sorry, importing only Mathlib; Solution.lean proves them), with nanoda — the independent Rust kernel —
# switched on; then #print axioms of the ten theorems from OUR file. What this decides: that the build at the pin compiles,
# that each named theorem states exactly what the challenge states, that only the three standard axioms are used, and that
# a second kernel accepts the proofs — a concordance with the claimant's own CI and the registry's check, never a
# verification of the mathematics beyond what the kernel is. A job that cannot finish is REFUSED, never REFUTED. The
# claimant's scripts are never run. Nothing here pushes. The artifact macmahon-kernel (result.json + logs) is read by
# tools/record-macmahon-kernel.js, which writes certs/macmahon-kernel.json.
#   gh workflow run macmahon-kernel.yml
name: macmahon-kernel
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLAIM_REPO: https://github.com/jasondavies/macmahon-min-universal-sets.git
  CLAIM_PIN: d8856c97e43e6fa66383c81b8ac4f5bd1c285bc8
  LEAN_TOOLCHAIN: leanprover/lean4:v4.35.0
  COMPARATOR_TAG: v4.35.0
  LANDRUN_PIN: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
  NANODA_PIN: 3a2407216ee84a75f9e1aead6803d0578be06ae7
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/kernel-tools
          key: macmahon-tools-${{ env.LEAN_TOOLCHAIN }}-${{ env.COMPARATOR_TAG }}-${{ env.LANDRUN_PIN }}-${{ env.NANODA_PIN }}-stack1g
      - name: build comparator (at its tag, with the claim's toolchain), lean4export (the revision its manifest pins), landrun, nanoda
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p ~/kernel-tools/bin ~/src && cd ~/src
          git clone -q https://github.com/leanprover/comparator.git && cd comparator && git checkout -q "$COMPARATOR_TAG"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git rev-parse HEAD > ~/kernel-tools/comparator.rev
          lake build lean4export comparator
          cp .lake/build/bin/comparator ~/kernel-tools/bin/
          cp .lake/packages/lean4export/.lake/build/bin/lean4export ~/kernel-tools/bin/
          (cd .lake/packages/lean4export && git rev-parse HEAD) > ~/kernel-tools/lean4export.rev
          cd ~/src && git clone -q https://github.com/Zouuup/landrun.git && cd landrun && git checkout -q "$LANDRUN_PIN"
          go build -o ~/kernel-tools/bin/landrun ./cmd/landrun
          cd ~/src && git clone -q https://github.com/ammkrn/nanoda_lib.git && cd nanoda_lib && git checkout -q "$NANODA_PIN"
          # ONE change to nanoda, as in every earlier lane: its worker threads' stack raised to 1 GiB
          sed -i 's/pub(crate) const STACK_SIZE: usize = 16_777_216;/pub(crate) const STACK_SIZE: usize = 1_073_741_824;/' src/lib.rs
          test "$(git diff --numstat src/lib.rs | awk '{print $1+$2}')" = "2"
          git diff | tee ~/kernel-tools/nanoda.patch
          cargo build --release -q
          cp target/release/nanoda_bin ~/kernel-tools/bin/
          ls -la ~/kernel-tools/bin
      - uses: actions/upload-artifact@v4
        with:
          name: macmahon-kernel-tools
          path: ~/kernel-tools
          retention-days: 3

  check:
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/macmahon-kernel-result.py
            corpus/macmahon/PINS.json
          sparse-checkout-cone-mode: false
          path: audit
      - uses: actions/download-artifact@v4
        with:
          name: macmahon-kernel-tools
          path: ~/kernel-tools
      - name: free disk and allow user namespaces (comparator's sandbox)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h / | tail -1
      - name: toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          chmod +x ~/kernel-tools/bin/*
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "$HOME/kernel-tools/bin" >> "$GITHUB_PATH"
      - name: the claim at its pin, every read file held to the digests pinned on the desk
        run: |
          set -euo pipefail
          git clone -q "$CLAIM_REPO" claim && cd claim && git checkout -q "$CLAIM_PIN"
          test "$(git rev-parse HEAD)" = "$CLAIM_PIN"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'PY'
          import hashlib, json
          pins = json.load(open('../audit/corpus/macmahon/PINS.json'))['files']
          held, skipped = 0, []
          for f, want in pins.items():
              if not f.endswith('.lean') and f not in ('comparator.json', 'lakefile.toml', 'lake-manifest.json', 'lean-toolchain'):
                  skipped.append(f); continue
              got = hashlib.sha256(open(f, 'rb').read()).hexdigest()
              assert got == want, 'the pinned file moved at the registered commit: ' + f
              held += 1
          print('held to the desk digests:', held, 'Lean/config files; not compared (paper, results, scripts):', len(skipped))
          PY
          cat comparator.json
      - name: dependencies and the Mathlib cache
        working-directory: claim
        run: |
          set -euo pipefail
          start=$(date +%s)
          lake exe cache get 2>&1 | tail -5
          echo "CACHE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          m = {p['name']: p['rev'] for p in json.load(open('lake-manifest.json'))['packages']}
          print('mathlib', m['mathlib'])
          PY
          df -h / | tail -1
      - name: build the three libraries the configuration audits
        working-directory: claim
        run: |
          set -euo pipefail
          start=$(date +%s)
          LEAN_NUM_THREADS=2 lake build MacMahon Challenge Solution 2>&1 | tail -20
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: comparator, Lean's kernel and nanoda, on the configuration the repository ships
        working-directory: claim
        run: |
          set +e
          mkdir -p ~/out
          {
            echo "kernel: $(uname -r)"; echo "landlock: $(cat /sys/kernel/security/lsm 2>/dev/null)"
            lean --version
            echo "comparator rev: $(cat ~/kernel-tools/comparator.rev)"
            echo "lean4export rev: $(cat ~/kernel-tools/lean4export.rev)"
            echo "nanoda build: stack1g"
            echo "claim: $(git rev-parse HEAD)"
          } > ~/out/env.txt 2>&1
          python3 - <<'PY'
          import json
          c = json.load(open('comparator.json'))
          c['enable_nanoda'] = True   # the ONE declared change: nanoda beside Lean's kernel
          json.dump(c, open('audit-config.json', 'w'), indent=1)
          print('theorems:', len(c['theorem_names']), 'axioms:', c['permitted_axioms'])
          PY
          ulimit -s unlimited || ulimit -s 4194304 || true
          export RUST_MIN_STACK=1073741824
          start=$(date +%s)
          /usr/bin/time -v lake env comparator audit-config.json > ~/out/comparator.log 2> ~/out/comparator.err
          echo $? > ~/out/exit.txt
          echo $(( $(date +%s) - start )) > ~/out/seconds.txt
          cp audit-config.json comparator.json ~/out/
          sha256sum Challenge.lean Solution.lean lean-toolchain lake-manifest.json comparator.json MacMahon/*.lean > ~/out/sha256.txt
          tail -40 ~/out/comparator.log; tail -40 ~/out/comparator.err
          exit 0
      - name: the axioms of the ten theorems, from OUR file
        working-directory: claim
        run: |
          set +e
          python3 - <<'PY'
          import json
          names = json.load(open('comparator.json'))['theorem_names']
          open('OurAxioms.lean', 'w').write('import Solution\n' + ''.join('#print axioms ' + n + '\n' for n in names))
          PY
          lake env lean OurAxioms.lean > ~/out/axioms.log 2> ~/out/axioms.err
          echo $? > ~/out/axioms.exit
          cat ~/out/axioms.log; tail -5 ~/out/axioms.err
          exit 0
      - name: result
        if: always()
        run: python3 audit/tools/macmahon-kernel-result.py ~/out > ~/out/result.json && cat ~/out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macmahon-kernel
          path: ~/out
          retention-days: 30
