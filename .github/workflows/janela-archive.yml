# Janela's back-archive, fetched in the cloud on demand: ECMWF open-data runs (what=ecmwf),
# NOAA altimeter mission-days (what=alt) or NOAA GFS-Wave runs, the second provider's forecasts
# (what=noaa) or ECMWF AIFS data-driven wave runs (what=aifs, from 2026-05-13), for a date range, read at every site — or only the
# sites named in `sites` (a new region) — exactly as apps/janela/audit/archive.py does on the
# desk, uploaded as an artifact (nothing is committed here; the desk packs the record).
name: janela-archive
on:
  workflow_dispatch:
    inputs:
      from: { description: 'first day (YYYY-MM-DD)', required: true }
      to: { description: 'last day (YYYY-MM-DD)', required: true }
      chunks: { description: 'parallel jobs (1-8)', required: false, default: '6' }
      what: { description: 'ecmwf, alt, noaa or aifs', required: false, default: 'ecmwf' }
      sites: { description: 'site ids, comma-separated (empty = every site)', required: false, default: '' }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ranges: ${{ steps.r.outputs.ranges }}
    steps:
      - id: r
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          a = dt.date.fromisoformat('${{ inputs.from }}'); b = dt.date.fromisoformat('${{ inputs.to }}')
          k = max(1, min(8, int('${{ inputs.chunks }}' or 6)))
          n = (b - a).days + 1; size = -(-n // k); out = []
          for i in range(k):
              s = a + dt.timedelta(days=i * size); e = min(b, s + dt.timedelta(days=size - 1))
              if s <= b: out.append({'from': s.isoformat(), 'to': e.isoformat()})
          print('ranges=' + json.dumps(out))
          PY
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        range: ${{ fromJSON(needs.plan.outputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/janela/requirements.txt
      - name: 'fetch, twice — the second pass picks up any day that errored'
        env:
          JANELA_SITES: ${{ inputs.sites }}
          JANELA_IPV4: '1'
          WHAT: ${{ inputs.what }}
        run: |
          case "$WHAT" in ecmwf|noaa|aifs) w1=16; w2=8;; alt) w1=6; w2=3;; *) echo "what must be ecmwf, alt, noaa or aifs"; exit 1;; esac
          cd apps/janela/audit
          python archive.py "$WHAT" ${{ matrix.range.from }} ${{ matrix.range.to }} --workers=$w1 || true
          python archive.py "$WHAT" ${{ matrix.range.from }} ${{ matrix.range.to }} --workers=$w2
      - uses: actions/upload-artifact@v4
        with:
          name: janela-${{ inputs.what }}-${{ matrix.range.from }}
          path: corpus/janela/cache/${{ inputs.what }}
          retention-days: 7
