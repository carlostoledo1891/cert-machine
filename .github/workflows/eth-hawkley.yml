# The Hawkley bridge replay — github.com/thinkthoughts/math @ d6b79b7d1 (a fork of openai/math) claims, in Lean,
#   OAI.Bridges.AnthropicETH.not_positiveRateETH_implies_ethIsFalse :
#     ¬ OAI.ParityWL.Complexity.PositiveRateETH → MainResults.ETHIsFalse
# (OpenAI ParityLifts' predicate, negated, implies Anthropic's ETHIsFalse), built inside OpenAI's lean/ project at
# openai/math @ 7ef5c0cc (Lean v4.34.1, Mathlib d13f23b7). This replays it with no code shared with the claimant:
#
#   tools      Comparator d03acab1 (tag v4.34.0) built with v4.34.1 and its lean4export 076e8e57, landrun 811cfff5,
#              nanoda 3a240721 with the issue44 patch and a 1 GiB stack: the OpenAI row of certs/eth-kernel.json
#   replay     a blob-filtered sparse clone of the fork at its pin; git's own facts (HEAD, a clean tree, the diff
#              against the base commit naming exactly the pinned delta); the statement checks and their red controls
#              (tools/eth-hawkley-gates.js); lake update FIRST (OpenAI's post_update hook; lane K's rule) with every
#              resolved revision checked against the pinned manifest; lake exe cache get; then, in this order
#              (Comparator first: its README's second assumption, nothing outside its sandbox has built the solution):
#                comparator   lake env comparator on the claimant's config with ONE change, enable_nanoda: true
#                             (he ships false): Lean's kernel and nanoda
#                build        lake build OAI.Bridges.AnthropicETH.Main
#                axioms       #print axioms of the theorem, from OUR file
#   Every step: exit code, wall seconds, GNU time's peak RSS, and the runner's used memory sampled every 15 s.
#
# No verdict here: tools/record-eth-hawkley.js downloads the artifact eth-hawkley and decides (CERTIFIED / REFUTED /
# REFUSED, the words of certs/eth-kernel.json). A step killed for time, memory or disk is REFUSED, never REFUTED.
# Nothing here pushes. Nothing of the claimant's is run (his scripts are bytes under the census).
name: eth-hawkley
on:
  push:
    branches: [eth-hawkley-replay]
  workflow_dispatch:
    inputs:
      glibc_tunables:
        description: 'GLIBC_TUNABLES for every Lean step (the eth-kernel lane declared this value; "none" = unset)'
        required: false
        default: 'glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1'
permissions:
  contents: read
env:
  FORK_REPO: https://github.com/thinkthoughts/math.git
  FORK_PIN: d6b79b7d165f9e6bef6e033949e3f14e913efdaa
  BASE_PIN: 7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a
  OAI_TOOLCHAIN: leanprover/lean4:v4.34.1
  MATHLIB_PIN: d13f23b723b8a846827a245b89c10fc7d3f11612
  COMPARATOR_PIN: d03acab154d269c06e60e4de7e4cc85deebff94b   # tag v4.34.0; its toolchain raised to v4.34.1
  COMPARATOR_TOOLCHAIN: leanprover/lean4:v4.34.1
  LEAN4EXPORT_434: 076e8e57707e813375e8f9da8bf989799ace9680  # comparator v4.34.0's manifest (its Export.Parse)
  LANDRUN_PIN: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
  NANODA_PIN: 3a2407216ee84a75f9e1aead6803d0578be06ae7
  NANODA_BUILD: issue44-stack1g
  ISSUE44_SHA256: 3939d228619a28d7437bad82c1d41fe1fd4597a7ea55b849840c0f7caa7d0ee5
  LEAN_GLIBC_TUNABLES: ${{ inputs.glibc_tunables || 'glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1' }}
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: corpus/openai-math/nanoda/issue44.patch
          sparse-checkout-cone-mode: false
          path: audit
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/kernel-tools
          key: eth-hawkley-tools-${{ env.COMPARATOR_PIN }}-${{ env.COMPARATOR_TOOLCHAIN }}-${{ env.LEAN4EXPORT_434 }}-${{ env.LANDRUN_PIN }}-${{ env.NANODA_PIN }}-${{ env.NANODA_BUILD }}-${{ env.ISSUE44_SHA256 }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: build comparator, lean4export, landrun, nanoda at their pins
        run: |
          set -euo pipefail
          start=$(date +%s)
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p ~/kernel-tools/bin ~/src && cd ~/src
          git clone -q https://github.com/leanprover/comparator.git && cd comparator && git checkout -q "$COMPARATOR_PIN"
          echo "$COMPARATOR_TOOLCHAIN" > lean-toolchain
          sed -i 's/"rev": "[0-9a-f]\{40\}"/"rev": "'"$LEAN4EXPORT_434"'"/' lake-manifest.json
          lake build lean4export comparator
          cp .lake/build/bin/comparator ~/kernel-tools/bin/
          cp .lake/packages/lean4export/.lake/build/bin/lean4export ~/kernel-tools/bin/lean4export
          test "$(cd .lake/packages/lean4export && git rev-parse HEAD)" = "$LEAN4EXPORT_434"
          cd ~/src && git clone -q https://github.com/Zouuup/landrun.git && cd landrun && git checkout -q "$LANDRUN_PIN"
          go build -o ~/kernel-tools/bin/landrun ./cmd/landrun
          cd ~/src && git clone -q https://github.com/ammkrn/nanoda_lib.git && cd nanoda_lib && git checkout -q "$NANODA_PIN"
          sed -i 's/pub(crate) const STACK_SIZE: usize = 16_777_216;/pub(crate) const STACK_SIZE: usize = 1_073_741_824;/' src/lib.rs
          test "$(git diff --numstat src/lib.rs | awk '{print $1+$2}')" = "2"
          P="$GITHUB_WORKSPACE/audit/corpus/openai-math/nanoda/issue44.patch"
          test "$(sha256sum "$P" | cut -d' ' -f1)" = "$ISSUE44_SHA256"
          git apply "$P"
          test -z "$(git diff --name-only | grep -v -x -e src/lib.rs -e src/tc.rs)"
          git diff > ~/kernel-tools/nanoda.patch
          cargo build --release -q
          cp target/release/nanoda_bin ~/kernel-tools/bin/
          echo "$NANODA_BUILD" > ~/kernel-tools/nanoda.build
          { echo "go: $(go version)"; echo "cargo: $(cargo --version)"; echo "rustc: $(rustc --version)"; } > ~/kernel-tools/builders.txt
          echo $(( $(date +%s) - start )) > ~/kernel-tools/tools-seconds.txt
          ls -la ~/kernel-tools/bin
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-tools-hawkley
          path: ~/kernel-tools
          retention-days: 3

  replay:
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      OUT: ${{ github.workspace }}/out
      W: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eth-hawkley-gates.js
            corpus/eth-refutation/pins.json
            corpus/eth-refutation/hawkley/pins.json
            corpus/eth-refutation/hawkley/src
            corpus/eth-refutation/hawkley/base
          sparse-checkout-cone-mode: false
          path: audit
      - uses: actions/download-artifact@v4
        with:
          name: kernel-tools-hawkley
          path: ~/kernel-tools
      - name: free disk, the memory sampler, the machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go || true
          mkdir -p "$OUT" "$W"
          chmod +x ~/kernel-tools/bin/*
          # the runner's used memory (MemTotal - MemAvailable, kB) every 15 s; background processes live until the job ends
          nohup bash -c 'while true; do echo "$(date +%s) $(awk "/^MemTotal:/{t=\$2} /^MemAvailable:/{a=\$2} END{print t-a}" /proc/meminfo)" >> "$OUT/mem.tsv"; sleep 15; done' > /dev/null 2>&1 &
          {
            echo "runner: $RUNNER_NAME $RUNNER_OS $RUNNER_ARCH, image $ImageOS $ImageVersion"
            echo "cpus: $(nproc)"; grep -E '^(MemTotal|SwapTotal):' /proc/meminfo
            echo "vm.max_map_count: $(cat /proc/sys/vm/max_map_count)"
            echo "kernel: $(uname -r)"; echo "landlock: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
            df -h / | tail -1
          } | tee "$OUT/machine.txt"
          cp ~/kernel-tools/nanoda.patch "$OUT/nanoda.patch"; cp ~/kernel-tools/builders.txt "$OUT/" 2>/dev/null || true
          cat > "$W/timed.sh" <<'EOF'
          # one timed step: $1 name, $2 timeout (s), the rest the command; files <name>.{log,err,exit,start,end} in $OUT
          # (safe under set -e: the exit code is caught, never fatal)
          timed() {
            local s=$1 to=$2 rc; shift 2
            date +%s > "$OUT/$s.start"; echo "$s" >> "$OUT/order.txt"
            ( ulimit -s unlimited 2>/dev/null || true; export RUST_MIN_STACK=1073741824
              if [ -n "${LEAN_GLIBC_TUNABLES:-}" ] && [ "$LEAN_GLIBC_TUNABLES" != none ]; then export GLIBC_TUNABLES="$LEAN_GLIBC_TUNABLES"; fi
              exec /usr/bin/time -v timeout "$to" "$@" > "$OUT/$s.log" 2> "$OUT/$s.err" ) && rc=0 || rc=$?
            echo "$rc" > "$OUT/$s.exit"
            date +%s > "$OUT/$s.end"
            echo "$s: exit $rc, $(( $(cat "$OUT/$s.end") - $(cat "$OUT/$s.start") )) s"
          }
          EOF
      - name: elan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: the fork at its pin, git's facts (HEAD, a clean tree, the diff against the base names exactly the delta)
        run: |
          set -euo pipefail
          cd "$W"
          git clone -q --filter=blob:none --no-checkout "$FORK_REPO" fork
          git -C fork sparse-checkout set --no-cone '/lean/*' '/lean/OAI/Combinatorics/**' '/lean/OAI/Bridges/**' '/lean/ComparatorChallenges/**' '/lean/Vendor/**' '/lean/scripts/**' '/docs/**' '/LICENSE' '/README.md' '/CONTENTS.md' '/history.md'
          git -C fork checkout -q "$FORK_PIN"
          test "$(git -C fork rev-parse HEAD)" = "$FORK_PIN"
          git -C fork rev-parse HEAD > "$OUT/head.txt"
          git -C fork cat-file -t "$BASE_PIN" > "$OUT/base-commit-type.txt"
          git -C fork merge-base --is-ancestor "$BASE_PIN" HEAD && echo "ancestor: $BASE_PIN is an ancestor of HEAD" | tee "$OUT/base-ancestor.txt"
          git -C fork diff --no-renames --name-only "$BASE_PIN" HEAD | sort > "$OUT/delta-names.txt"
          git -C fork status --porcelain > "$OUT/status-before.txt"
          wc -l "$OUT/delta-names.txt"; cat "$OUT/status-before.txt"
          test "$(cat fork/lean/lean-toolchain)" = "$OAI_TOOLCHAIN"
          node -e '
            const fs = require("fs");
            const want = Object.keys(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).hawkley.files).filter((f) => f !== "LICENSE").sort();
            const got = fs.readFileSync(process.argv[2], "utf8").trim().split("\n").filter(Boolean).sort();
            const same = JSON.stringify(want) === JSON.stringify(got);
            fs.writeFileSync(process.argv[3], JSON.stringify({ ok: same, pinned: want.length, gitDiff: got.length, missing: want.filter((f) => !got.includes(f)), extra: got.filter((f) => !want.includes(f)) }, null, 1) + "\n");
            console.log(same ? "git diff names exactly the pinned delta (" + got.length + " files)" : "git diff and the pinned delta DIFFER");
          ' "$GITHUB_WORKSPACE/audit/corpus/eth-refutation/hawkley/pins.json" "$OUT/delta-names.txt" "$OUT/delta-check.json"
          # the delta's bytes, as checked out, for the recorder's own gate run
          mkdir -p "$OUT/src"
          (cd fork && { cat "$OUT/delta-names.txt"; echo LICENSE; } | xargs -I{} cp --parents {} "$OUT/src")
      - name: the statement checks and their red controls (tools/eth-hawkley-gates.js)
        run: |
          set -o pipefail
          G="$GITHUB_WORKSPACE/audit/tools/eth-hawkley-gates.js"
          ETH_HAWKLEY_FACTS="$OUT/sources-facts.json" node "$G" sources "$W/fork" --clone --base "$GITHUB_WORKSPACE/audit/corpus/eth-refutation/hawkley/base" 2>&1 | tee "$OUT/sources-gate.txt"
          node "$G" controls 2>&1 | tee "$OUT/controls-gate.txt"
      - name: lake update (OpenAI's post_update hook; every resolved revision against the pinned manifest), the Mathlib cache
        working-directory: work/fork/lean
        run: |
          set -euo pipefail
          . "$W/timed.sh"
          timed update 3600 lake update
          tail -5 "$OUT/update.log" || true
          test "$(cat "$OUT/update.exit")" = 0
          python3 -I - "$GITHUB_WORKSPACE/audit/corpus/eth-refutation/pins.json" <<'EOF' | tee "$OUT/manifest-check.txt"
          import json, sys
          want = {d['name']: d['rev'] for d in json.load(open(sys.argv[1]))['claims']['openai']['dependencies']}
          got = {p['name']: p['rev'] for p in json.load(open('lake-manifest.json'))['packages']}
          moved = sorted(k for k in want if got.get(k) != want[k])
          extra = sorted(k for k in got if k not in want)
          if moved or extra: sys.exit('lake update moved a pinned dependency: ' + ', '.join(moved) + (' / unpinned: ' + ', '.join(extra) if extra else ''))
          print('all %d dependency revisions equal the pinned manifest' % len(want))
          EOF
          cp lake-manifest.json "$OUT/lake-manifest.json"
          df -h / | tail -1
          timed cache 3600 lake exe cache get
          tail -5 "$OUT/cache.log" || true
          test "$(cat "$OUT/cache.exit")" = 0
          echo "mathlib: $(cd .lake/packages/mathlib && git rev-parse HEAD)" | tee "$OUT/mathlib.txt"
          test "$(cd .lake/packages/mathlib && git rev-parse HEAD)" = "$MATHLIB_PIN"
          sha256sum lakefile.lean lake-manifest.json lean-toolchain > "$OUT/project-files.sha256"
          {
            echo "toolchain: $(cat lean-toolchain)"; lean --version; lake --version
            echo "lean prefix: $(lean --print-prefix)"
            echo "comparator: $COMPARATOR_PIN built with $COMPARATOR_TOOLCHAIN"
            echo "lean4export: $LEAN4EXPORT_434 built with $COMPARATOR_TOOLCHAIN"
            echo "nanoda: $NANODA_PIN, build $(cat ~/kernel-tools/nanoda.build)"
            echo "landrun: $LANDRUN_PIN"
            echo "GLIBC_TUNABLES: $LEAN_GLIBC_TUNABLES"
            echo "fork: $FORK_PIN (base $BASE_PIN)"
            echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            cat "$OUT/machine.txt"
          } > "$OUT/env.txt" 2>&1
          cat "$OUT/env.txt"
          df -h / | tail -1
      - name: comparator on the claimant's config with nanoda on (the one declared change), Lean's kernel and nanoda
        working-directory: work/fork/lean
        run: |
          set +e
          . "$W/timed.sh"
          python3 -I -c 'import json,sys; c=json.load(open(sys.argv[1])); c["enable_nanoda"]=True; json.dump(c,open(sys.argv[2],"w"),indent=1)' ComparatorChallenges/AnthropicETHCrossFormalization.json audit-config-hawkley.json
          cp audit-config-hawkley.json "$OUT/audit-config.json"
          LP="$(lean --print-prefix)/bin"
          timed comparator 12000 env PATH="$LP:$PATH" COMPARATOR_LANDRUN="$HOME/kernel-tools/bin/landrun" \
            COMPARATOR_LEAN4EXPORT="$HOME/kernel-tools/bin/lean4export" COMPARATOR_NANODA="$HOME/kernel-tools/bin/nanoda_bin" \
            lake env "$HOME/kernel-tools/bin/comparator" audit-config-hawkley.json
          tail -30 "$OUT/comparator.log"; tail -30 "$OUT/comparator.err"
          df -h / | tail -1
          exit 0
      - name: lake build OAI.Bridges.AnthropicETH.Main
        working-directory: work/fork/lean
        run: |
          set +e
          . "$W/timed.sh"
          timed build 6600 lake build OAI.Bridges.AnthropicETH.Main
          tail -20 "$OUT/build.log"; tail -20 "$OUT/build.err"
          exit 0
      - name: '#print axioms of the theorem, from our file'
        working-directory: work/fork/lean
        run: |
          set +e
          . "$W/timed.sh"
          printf 'import OAI.Bridges.AnthropicETH.Main\n#print axioms OAI.Bridges.AnthropicETH.not_positiveRateETH_implies_ethIsFalse\n' > AuditAxiomsHawkley.lean
          cp AuditAxiomsHawkley.lean "$OUT/AuditAxioms.lean"
          timed axioms 1200 lake env lean AuditAxiomsHawkley.lean
          cat "$OUT/axioms.log" "$OUT/axioms.err" | grep -v -E '^\s+(Command being timed|User time|System time|Percent of CPU|Elapsed|Average|Maximum resident|Major|Minor|Voluntary|Involuntary|Swaps|File system|Socket|Signals|Page size|Exit status)'
          exit 0
      - name: git's facts after, the delta's bytes after
        if: always()
        working-directory: work/fork
        run: |
          git status --porcelain > "$OUT/status-after.txt" || true
          git rev-parse HEAD > "$OUT/head-after.txt" || true
          { cat "$OUT/delta-names.txt"; echo LICENSE; } | xargs sha256sum > "$OUT/delta-after.sha256" || true
          cp lean/lakefile.lean "$OUT/lakefile.lean" || true
          free -k > "$OUT/free-end.txt"; df -h / >> "$OUT/free-end.txt"
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-hawkley
          path: ${{ github.workspace }}/out
          retention-days: 90
