# The TSavo bridge replay — github.com/TSavo/eth-bridge @ 34f9ca20 claims, in Lean,
#   Bridge.ethIsFalse_of_claim : OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.Claim → MainResults.ETHIsFalse
# (OpenAI's challenge statement, as a proposition, implies Anthropic's ETHIsFalse), built inside Anthropic's eth
# project (anthropics/formal-math @ 16a5ce41, Lean v4.33.1, Anthropic's Mathlib 0df444a3). This replays it with no
# code shared with the claimant:
#
#   tools      Comparator d03acab1 (tag v4.34.0) built with v4.34.1, lean4export 15f6055e (tag v4.33.0) built with
#              v4.33.1, landrun 811cfff5, nanoda 3a240721 with the issue44 patch and a 1 GiB stack: the versions and
#              the declared changes of the Anthropic row of certs/eth-kernel.json, nothing else
#   replay     both clones at their pins, every byte against corpus/eth-refutation/pins.json and
#              corpus/eth-refutation/tsavo/pins.json; the statement checks and their red controls
#              (tools/eth-tsavo-gates.js); bridge/ placed inside eth/ and the README's [[lean_lib]] Bridge block
#              appended; lake exe cache get; then, in this order (Comparator first: its README's second assumption,
#              nothing outside its sandbox has built the solution):
#                comparator-readme   lake env comparator on TSavo's own comparator_bridge.json (enable_nanoda already
#                                    true), Lean's kernel and nanoda, on the README's lakefile
#                comparator-amended  ONLY if the first stops because Lake cannot resolve the challenge module
#                                    BridgeChallenge (the README's block puts it in no library): the ONE declared
#                                    amendment, a [[lean_lib]] BridgeChallenge with srcDir "bridge" (no Lean byte, no
#                                    config byte changes), and Comparator again
#                build               lake build Bridge (the README's build)
#                axioms              #print axioms of Bridge.ethIsFalse_of_claim and Bridge.two_proofs_one_statement,
#                                    from OUR file
#   Every step: exit code, wall seconds, GNU time's peak RSS, and the runner's used memory sampled every 15 s.
#
# No verdict here: tools/record-eth-tsavo.js downloads the artifact eth-tsavo and decides (CERTIFIED / REFUTED /
# REFUSED, the words of certs/eth-kernel.json). A step killed for time or memory is REFUSED, never REFUTED.
# Nothing here pushes.
name: eth-tsavo
on:
  push:
    branches: [eth-tsavo-replay]
  workflow_dispatch:
    inputs:
      glibc_tunables:
        description: 'GLIBC_TUNABLES for every Lean step (the eth-kernel lane declared this value; "none" = unset)'
        required: false
        default: 'glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1'
permissions:
  contents: read
env:
  ANT_REPO: https://github.com/anthropics/formal-math.git
  ANT_PIN: 16a5ce41304fcdaea4e0be7c132e1c361dc26da5
  ANT_TOOLCHAIN: leanprover/lean4:v4.33.1
  TSAVO_REPO: https://github.com/TSavo/eth-bridge.git
  TSAVO_PIN: 34f9ca204bed7fa6c595e56966773726e98dd3fd
  COMPARATOR_PIN: d03acab154d269c06e60e4de7e4cc85deebff94b   # tag v4.34.0; its toolchain raised to v4.34.1
  COMPARATOR_TOOLCHAIN: leanprover/lean4:v4.34.1
  LEAN4EXPORT_434: 076e8e57707e813375e8f9da8bf989799ace9680  # comparator v4.34.0's manifest (its Export.Parse)
  LEAN4EXPORT_433: 15f6055e299ad5b89345e533cc2192f4cc00f659  # tag v4.33.0, built with the claim's v4.33.1
  LANDRUN_PIN: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
  NANODA_PIN: 3a2407216ee84a75f9e1aead6803d0578be06ae7
  NANODA_BUILD: issue44-stack1g
  ISSUE44_SHA256: 3939d228619a28d7437bad82c1d41fe1fd4597a7ea55b849840c0f7caa7d0ee5
  LEAN_GLIBC_TUNABLES: ${{ inputs.glibc_tunables || 'glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1' }}
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: corpus/openai-math/nanoda/issue44.patch
          sparse-checkout-cone-mode: false
          path: audit
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/kernel-tools
          key: eth-tsavo-tools-${{ env.COMPARATOR_PIN }}-${{ env.COMPARATOR_TOOLCHAIN }}-${{ env.LEAN4EXPORT_434 }}-${{ env.LEAN4EXPORT_433 }}-${{ env.ANT_TOOLCHAIN }}-${{ env.LANDRUN_PIN }}-${{ env.NANODA_PIN }}-${{ env.NANODA_BUILD }}-${{ env.ISSUE44_SHA256 }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: build comparator, lean4export (v4.33.0 with v4.33.1), landrun, nanoda at their pins
        run: |
          set -euo pipefail
          start=$(date +%s)
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p ~/kernel-tools/bin ~/kernel-tools/v4.33.1 ~/src && cd ~/src
          git clone -q https://github.com/leanprover/comparator.git && cd comparator && git checkout -q "$COMPARATOR_PIN"
          echo "$COMPARATOR_TOOLCHAIN" > lean-toolchain
          sed -i 's/"rev": "[0-9a-f]\{40\}"/"rev": "'"$LEAN4EXPORT_434"'"/' lake-manifest.json
          lake build lean4export comparator
          cp .lake/build/bin/comparator ~/kernel-tools/bin/
          test "$(cd .lake/packages/lean4export && git rev-parse HEAD)" = "$LEAN4EXPORT_434"
          cd ~/src && git clone -q https://github.com/leanprover/lean4export.git lean4export-433 && cd lean4export-433 && git checkout -q "$LEAN4EXPORT_433"
          echo "lean4export $LEAN4EXPORT_433 ships toolchain $(cat lean-toolchain); built with $ANT_TOOLCHAIN" > ~/kernel-tools/lean4export-433.txt
          echo "$ANT_TOOLCHAIN" > lean-toolchain
          lake build lean4export
          cp .lake/build/bin/lean4export ~/kernel-tools/v4.33.1/lean4export
          cd ~/src && git clone -q https://github.com/Zouuup/landrun.git && cd landrun && git checkout -q "$LANDRUN_PIN"
          go build -o ~/kernel-tools/bin/landrun ./cmd/landrun
          cd ~/src && git clone -q https://github.com/ammkrn/nanoda_lib.git && cd nanoda_lib && git checkout -q "$NANODA_PIN"
          sed -i 's/pub(crate) const STACK_SIZE: usize = 16_777_216;/pub(crate) const STACK_SIZE: usize = 1_073_741_824;/' src/lib.rs
          test "$(git diff --numstat src/lib.rs | awk '{print $1+$2}')" = "2"
          P="$GITHUB_WORKSPACE/audit/corpus/openai-math/nanoda/issue44.patch"
          test "$(sha256sum "$P" | cut -d' ' -f1)" = "$ISSUE44_SHA256"
          git apply "$P"
          test -z "$(git diff --name-only | grep -v -x -e src/lib.rs -e src/tc.rs)"
          git diff > ~/kernel-tools/nanoda.patch
          cargo build --release -q
          cp target/release/nanoda_bin ~/kernel-tools/bin/
          echo "$NANODA_BUILD" > ~/kernel-tools/nanoda.build
          { echo "go: $(go version)"; echo "cargo: $(cargo --version)"; echo "rustc: $(rustc --version)"; } > ~/kernel-tools/builders.txt
          echo $(( $(date +%s) - start )) > ~/kernel-tools/tools-seconds.txt
          ls -la ~/kernel-tools/bin ~/kernel-tools/v4.33.1
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-tools-tsavo
          path: ~/kernel-tools
          retention-days: 3

  replay:
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      OUT: ${{ github.workspace }}/out
      W: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eth-tsavo-gates.js
            tools/eth-pod-facts.py
            corpus/eth-refutation/pins.json
            corpus/eth-refutation/tsavo/pins.json
          sparse-checkout-cone-mode: false
          path: audit
      - uses: actions/download-artifact@v4
        with:
          name: kernel-tools-tsavo
          path: ~/kernel-tools
      - name: free disk, the memory sampler, the machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          mkdir -p "$OUT" "$W"
          chmod +x ~/kernel-tools/bin/* ~/kernel-tools/v4.33.1/*
          # the runner's used memory (MemTotal - MemAvailable, kB) every 15 s; background processes live until the job ends
          nohup bash -c 'while true; do echo "$(date +%s) $(awk "/^MemTotal:/{t=\$2} /^MemAvailable:/{a=\$2} END{print t-a}" /proc/meminfo)" >> "$OUT/mem.tsv"; sleep 15; done' > /dev/null 2>&1 &
          {
            echo "runner: $RUNNER_NAME $RUNNER_OS $RUNNER_ARCH, image $ImageOS $ImageVersion"
            echo "cpus: $(nproc)"; grep -E '^(MemTotal|SwapTotal):' /proc/meminfo
            echo "vm.max_map_count: $(cat /proc/sys/vm/max_map_count)"
            echo "kernel: $(uname -r)"; echo "landlock: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
            df -h / | tail -1
          } | tee "$OUT/machine.txt"
          cp ~/kernel-tools/nanoda.patch "$OUT/nanoda.patch"; cp ~/kernel-tools/lean4export-433.txt "$OUT/"; cp ~/kernel-tools/builders.txt "$OUT/" 2>/dev/null || true
          cat > "$W/timed.sh" <<'EOF'
          # one timed step: $1 name, $2 timeout (s), the rest the command; files <name>.{log,err,exit,start,end} in $OUT
          # (safe under set -e: the exit code is caught, never fatal)
          timed() {
            local s=$1 to=$2 rc; shift 2
            date +%s > "$OUT/$s.start"; echo "$s" >> "$OUT/order.txt"
            ( ulimit -s unlimited 2>/dev/null || true; export RUST_MIN_STACK=1073741824
              if [ -n "${LEAN_GLIBC_TUNABLES:-}" ] && [ "$LEAN_GLIBC_TUNABLES" != none ]; then export GLIBC_TUNABLES="$LEAN_GLIBC_TUNABLES"; fi
              exec /usr/bin/time -v timeout "$to" "$@" > "$OUT/$s.log" 2> "$OUT/$s.err" ) && rc=0 || rc=$?
            echo "$rc" > "$OUT/$s.exit"
            date +%s > "$OUT/$s.end"
            echo "$s: exit $rc, $(( $(cat "$OUT/$s.end") - $(cat "$OUT/$s.start") )) s"
          }
          EOF
      - name: elan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: the two clones at their pins, every byte against the pins
        run: |
          set -euo pipefail
          cd "$W"
          git clone -q "$TSAVO_REPO" tsavo && git -C tsavo checkout -q "$TSAVO_PIN"
          test "$(git -C tsavo rev-parse HEAD)" = "$TSAVO_PIN"
          git clone -q --filter=blob:none --no-checkout "$ANT_REPO" ant
          git -C ant sparse-checkout set --no-cone '/eth/**' '/.github/**'
          git -C ant checkout -q "$ANT_PIN"
          test "$(git -C ant rev-parse HEAD)" = "$ANT_PIN"
          python3 -I "$GITHUB_WORKSPACE/audit/tools/eth-pod-facts.py" verify anthropic "$W/ant" "$GITHUB_WORKSPACE/audit/corpus/eth-refutation/pins.json" eth .github > "$OUT/verify-anthropic.json"
          cat "$OUT/verify-anthropic.json"
          test "$(cat ant/eth/lean-toolchain)" = "$ANT_TOOLCHAIN"
          mkdir -p "$OUT/src" && (cd tsavo && git ls-files -z | xargs -0 cp --parents -t "$OUT/src")
      - name: the statement checks and their red controls (tools/eth-tsavo-gates.js)
        run: |
          set -o pipefail
          G="$GITHUB_WORKSPACE/audit/tools/eth-tsavo-gates.js"
          ETH_TSAVO_FACTS="$OUT/sources-facts.json" node "$G" sources "$W/tsavo" "$W/ant/eth" 2>&1 | tee "$OUT/sources-gate.txt"
          node "$G" controls "$W/tsavo" - "$W/ant/eth" 2>&1 | tee "$OUT/controls-gate.txt"
      - name: bridge/ inside eth/, the README's lakefile block appended, the Mathlib cache
        working-directory: work/ant/eth
        run: |
          set -euo pipefail
          cp -r "$W/tsavo/bridge" bridge
          cp "$W/tsavo/comparator_bridge.json" .
          node "$GITHUB_WORKSPACE/audit/tools/eth-tsavo-gates.js" lakefile "$W/tsavo" . | tee "$OUT/lakefile-step.txt"
          cp lakefile.toml "$OUT/lakefile-readme.toml"
          . "$W/timed.sh"
          timed cache 3600 lake exe cache get
          tail -5 "$OUT/cache.log" || true
          test "$(cat "$OUT/cache.exit")" = 0
          echo "mathlib: $(cd .lake/packages/mathlib && git rev-parse HEAD)" | tee "$OUT/mathlib.txt"
          test "$(cd .lake/packages/mathlib && git rev-parse HEAD)" = 0df444a360eaa60ab8c11dca51a86af692955474
          cp lake-manifest.json "$OUT/lake-manifest.json"
          find . -path ./.lake -prune -o -type f -print | sort | xargs sha256sum > "$OUT/sources-before.sha256"
          {
            echo "toolchain: $(cat lean-toolchain)"; lean --version; lake --version
            echo "lean prefix: $(lean --print-prefix)"
            echo "comparator: $COMPARATOR_PIN built with $COMPARATOR_TOOLCHAIN"
            echo "lean4export: $LEAN4EXPORT_433 built with $ANT_TOOLCHAIN"
            echo "nanoda: $NANODA_PIN, build $(cat ~/kernel-tools/nanoda.build)"
            echo "landrun: $LANDRUN_PIN"
            echo "GLIBC_TUNABLES: $LEAN_GLIBC_TUNABLES"
            echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            cat "$OUT/machine.txt"
          } > "$OUT/env.txt" 2>&1
          cat "$OUT/env.txt"
          df -h / | tail -1
      - name: comparator on TSavo's config, Lean's kernel and nanoda (the README's lakefile; the declared amendment only if Lake cannot resolve the challenge)
        working-directory: work/ant/eth
        run: |
          set +e
          . "$W/timed.sh"
          # TSavo's own config with enable_nanoda forced true (it ships true: the copy is the same JSON)
          python3 -I -c 'import json,sys; c=json.load(open(sys.argv[1])); c["enable_nanoda"]=True; json.dump(c,open(sys.argv[2],"w"),indent=1)' comparator_bridge.json audit-config-tsavo.json
          cp audit-config-tsavo.json "$OUT/audit-config.json"
          LP="$(lean --print-prefix)/bin"
          run_comparator() {
            timed "$1" 12000 env PATH="$LP:$PATH" COMPARATOR_LANDRUN="$HOME/kernel-tools/bin/landrun" \
              COMPARATOR_LEAN4EXPORT="$HOME/kernel-tools/v4.33.1/lean4export" COMPARATOR_NANODA="$HOME/kernel-tools/bin/nanoda_bin" \
              lake env "$HOME/kernel-tools/bin/comparator" audit-config-tsavo.json
            tail -30 "$OUT/$1.log"; tail -30 "$OUT/$1.err"
          }
          run_comparator comparator-readme
          L="$OUT/comparator-readme.log"; E="$OUT/comparator-readme.err"
          if [ "$(cat "$OUT/comparator-readme.exit")" != 0 ] && grep -q '^Building BridgeChallenge' "$L" && ! grep -q '^Building Bridge.Main' "$L" \
             && grep -qiE 'unknown (target|module)[^a-z]*`?BridgeChallenge' "$L" "$E"; then
            echo "Lake cannot resolve the challenge module on the README's lakefile: the declared amendment" | tee "$OUT/amendment.txt"
            node "$GITHUB_WORKSPACE/audit/tools/eth-tsavo-gates.js" lakefile "$W/tsavo" . --challenge-lib | tee -a "$OUT/amendment.txt"
            cp lakefile.toml "$OUT/lakefile-amended.toml"
            run_comparator comparator-amended
          fi
          exit 0
      - name: lake build Bridge (the README's build)
        working-directory: work/ant/eth
        run: |
          set +e
          . "$W/timed.sh"
          timed build 6600 lake build Bridge
          tail -20 "$OUT/build.log"; tail -20 "$OUT/build.err"
          exit 0
      - name: '#print axioms of both theorems, from our file'
        working-directory: work/ant/eth
        run: |
          set +e
          . "$W/timed.sh"
          printf 'import Bridge.Main\nimport Bridge.Joint\n#print axioms Bridge.ethIsFalse_of_claim\n#print axioms Bridge.two_proofs_one_statement\n' > AuditAxiomsTsavo.lean
          cp AuditAxiomsTsavo.lean "$OUT/AuditAxioms.lean"
          timed axioms 1200 lake env lean AuditAxiomsTsavo.lean
          cat "$OUT/axioms.log" "$OUT/axioms.err" | grep -v -E '^\s+(Command being timed|User time|System time|Percent of CPU|Elapsed|Average|Maximum resident|Major|Minor|Voluntary|Involuntary|Swaps|File system|Socket|Signals|Page size|Exit status)'
          exit 0
      - name: hashes after, the lakefile as built
        if: always()
        working-directory: work/ant/eth
        run: |
          find . -path ./.lake -prune -o -type f -print | sort | xargs sha256sum > "$OUT/sources-after.sha256" || true
          cp lakefile.toml "$OUT/lakefile.toml" || true
          free -k > "$OUT/free-end.txt"; df -h / >> "$OUT/free-end.txt"
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-tsavo
          path: ${{ github.workspace }}/out
          retention-days: 90
