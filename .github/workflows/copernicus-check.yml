# Does the cloud reach Copernicus Marine with the repository's secrets? A hand-run check
# (2026-10-07): the toolbox validates the login, then reads ONE value — the total surface
# current (tide and Stokes drift included) at the Santos site, the first forecast hour of
# today — from the global analysis-and-forecast product Janela's currents will come from.
# Nothing is committed. The secrets are read by the toolbox from the environment; GitHub
# masks them in the log.
name: copernicus-check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q copernicusmarine
      - name: the login is valid
        run: copernicusmarine login --check-credentials-valid
      - name: one value read (Santos, today 00 UTC, surface)
        run: |
          day=$(date -u +%F)
          copernicusmarine subset --dataset-id cmems_mod_glo_phy_anfc_merged-uv_PT1H-i \
            --variable utotal --variable vtotal --variable utide --variable vtide \
            --minimum-longitude -43.05 --maximum-longitude -42.95 --minimum-latitude -25.55 --maximum-latitude -25.45 \
            --start-datetime "${day}T00:00:00" --end-datetime "${day}T00:00:00" \
            --output-directory /tmp/cm --output-filename santos.nc --disable-progress-bar
          pip install -q xarray netcdf4
          python - <<'PY'
          import xarray as xr
          ds = xr.open_dataset('/tmp/cm/santos.nc')
          print(ds)
          for v in ('utotal', 'vtotal', 'utide', 'vtide'):
              print(v, float(ds[v].values.ravel()[0]), ds[v].attrs.get('units'))
          PY
