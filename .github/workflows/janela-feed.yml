# Janela's daily feed: read today's ECMWF 00 UTC forecast at every site, commit the
# ensemble bands to the ledger BEFORE their target times, and PUSH AT ONCE — the push
# time is the outside proof that every commit row predates the sea it forecasts, so
# nothing that can fail (NOAA, the map field) runs before it.
# Then the SECOND PROVIDER: NOAA's WAVEWATCH III (GEFS-Wave's 31 members and GFS-Wave,
# apps/janela/audit/noaa.py), its bands committed under their own proposer and pushed on
# their own — after the ECMWF push and allowed to fail, so NOAA can never hold up or break
# the ECMWF day.
# Then the scoring (observe days ended three days ago, score; a NOAA failure is a
# warning, never a lost day), pushed on its own. Every push goes through
# apps/janela/audit/push.sh: guard.js refuses any staged change that is not an append.
# Then the app's DAY: the forecast field over the margin and every production unit's
# forecast (field.py), the day's bands and published decisions (build-today.js, gated by
# both batteries and by re-deciding every decision from the written bytes), published as
# the single force-pushed commit of the orphan branch `janela-field` — so main grows by
# the feed and the ledger only, never by a day of app data. The app shell (/janela/) and
# the method page (/janela/metodo/) are static on main and are rebuilt when code or
# records change (node apps/janela/build.js), not daily.
# Runs after ECMWF publishes the 00 UTC wave ensemble (the 168 h ensemble lands at
# ~08:50–08:55 UTC, measured on three days), and again in four later slots: every step is
# safe to repeat (a feed is written once, commit ids are unique, a day is observed once,
# nothing is rescored, and a day already on janela-field is not rebuilt), so a later run
# only does what an earlier one could not, and a run with nothing to do pushes nothing.
# EVERY HOUR, BEHIND A GATE (2026-10-07). On the first scheduled day no slot fired by 14:40
# UTC; the operator's other repositories' weekly crons run 8–9 HOURS late on this account
# (GitHub may delay or drop scheduled runs under load). The day was dispatched by hand at
# 12:17 and the 06 and 12 UTC targets were lost. So the schedule asks every hour, and a
# light `gate` job (no checkout, ~10 s) decides whether there is anything to do: nothing
# until today's ECMWF 00 UTC wave ensemble is complete (its 168 h index answers 200), and
# then only while today's ECMWF feed, NOAA's feed (until 20 UTC) or the app's day is not
# yet published. However late GitHub fires the hourly slots, one lands after ~09 UTC.
# A hand dispatch always runs. The punctual trigger on the operator's desk is
# tools/janela-watchdog.sh (launchd, the gh login already there): hourly from 09:05 UTC
# until the day's "Janela feed" commit is on main.
name: janela-feed
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: janela-feed
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      todo: ${{ steps.g.outputs.todo }}
    steps:
      - name: is there anything to do today?
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          today=$(date -u +%F); ymd=$(date -u +%Y%m%d)
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "todo=true" >> "$GITHUB_OUTPUT"; echo "dispatched by hand: run"; exit 0; fi
          code=$(curl -s -4 -o /dev/null -w '%{http_code}' "https://storage.googleapis.com/ecmwf-open-data/${ymd}/00z/ifs/0p25/waef/${ymd}000000-168h-waef-ef.index" || true)
          if [ "$code" != "200" ]; then echo "todo=false" >> "$GITHUB_OUTPUT"; echo "ECMWF ${ymd} 00 UTC not complete yet (${code}): nothing to do"; exit 0; fi
          msgs=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&since=${today}T00:00:00Z&per_page=100" --jq '.[].commit.message | split("\n")[0]')
          day=$(gh api "repos/${GITHUB_REPOSITORY}/commits/janela-field" --jq '.commit.message | split("\n")[0]' || true)
          todo=false
          grep -q "^Janela feed ${today}:" <<< "$msgs" || { todo=true; echo "the ECMWF feed of ${today} is not on main"; }
          case "$day" in "Janela day ${today}:"*) ;; *) todo=true; echo "janela-field does not carry ${today}";; esac
          if [ "$(date -u +%H)" -lt 20 ]; then grep -q "^Janela feed-noaa ${today}:" <<< "$msgs" || { todo=true; echo "NOAA's feed of ${today} is not on main"; }; fi
          echo "todo=$todo" >> "$GITHUB_OUTPUT"; echo "todo=$todo"
  feed:
    needs: gate
    if: needs.gate.outputs.todo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # GitHub's runners have no IPv6 route; coastwatch.noaa.gov publishes an AAAA record
      JANELA_IPV4: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install the decoder
        run: pip install -r apps/janela/requirements.txt
      - name: the gates — the window instrument's battery and Janela's
        run: |
          node instruments/window/battery.js
          node apps/janela/battery.js
      - name: read today's forecast at every site
        run: cd apps/janela/audit && python feed.py
      - name: commit the bands before the sea happens
        run: node apps/janela/audit/commit.js
      - name: push the forecasts now (the push time proves every row predates its target)
        run: |
          bash apps/janela/audit/push.sh "Janela feed $(date -u +%F): ECMWF 00 UTC at the Janela sites; bands committed to certs/janela-ledger at least an hour before their target times" corpus/janela/feed certs/janela-ledger
      - name: "the second provider: NOAA's WAVEWATCH III at every site (noaa.py; may fail without touching the ECMWF day)"
        id: noaa
        continue-on-error: true
        timeout-minutes: 20
        run: cd apps/janela/audit && python noaa.py
      - name: commit NOAA's bands before the sea happens, and push them
        if: steps.noaa.outcome == 'success'
        continue-on-error: true
        run: |
          node apps/janela/audit/commit.js --noaa
          bash apps/janela/audit/push.sh "Janela feed-noaa $(date -u +%F): NOAA WAVEWATCH III 00 UTC at the Janela sites; GEFS-Wave bands committed to certs/janela-ledger at least an hour before their target times" corpus/janela/feed-noaa certs/janela-ledger
      - name: "the third provider, graded and never deciding: ECMWF's data-driven AIFS at every site (aifs.py; may fail without touching the day)"
        id: aifs
        continue-on-error: true
        timeout-minutes: 25
        run: cd apps/janela/audit && python aifs.py
      - name: commit AIFS's bands before the sea happens, and push them
        if: steps.aifs.outcome == 'success'
        continue-on-error: true
        run: |
          node apps/janela/audit/commit.js --aifs
          bash apps/janela/audit/push.sh "Janela feed-aifs $(date -u +%F): ECMWF AIFS (data-driven) 00 UTC at the Janela sites; its ensemble and calibrated bands committed to certs/janela-ledger at least an hour before their target times (graded, never deciding)" corpus/janela/feed-aifs certs/janela-ledger
      - name: observe what the satellites saw (days ended three days ago)
        continue-on-error: true
        timeout-minutes: 25
        run: cd apps/janela/audit && python observe.py
      - name: "what the satellites say the surface current was (GlobCurrent, days ended three days ago; the current forecasts' truth)"
        continue-on-error: true
        timeout-minutes: 15
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: cd apps/janela/audit && python currents_observe.py
      - name: score the ledger against those observations
        continue-on-error: true
        run: |
          node apps/janela/audit/score.js
          node apps/janela/audit/decisions.js score
      - name: push the observations and the scores
        run: |
          bash apps/janela/audit/push.sh "Janela observed $(date -u +%F): satellite passes at the Janela sites (with their points), GlobCurrent's currents, and the ledger scored" corpus/janela/observed corpus/janela/currents-observed certs/janela-ledger
      - name: is the app's day for this run already published?
        id: day
        run: |
          run=$(ls corpus/janela/feed | grep -E '^[0-9]{8}\.json\.gz$' | sort | tail -1 | cut -c1-8)
          echo "run=${run:0:4}-${run:4:2}-${run:6:2}" >> "$GITHUB_OUTPUT"
          if git fetch -q --depth=1 origin janela-field && git log -1 --format=%s FETCH_HEAD | grep -q "^Janela day ${run:0:4}-${run:4:2}-${run:6:2}:"; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "janela-field already carries the ${run} run"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "the map field and every production unit's forecast (field.py: forecast ink, never decided on)"
        if: steps.day.outputs.done != 'true'
        run: |
          cd apps/janela/audit && python field.py "${{ steps.day.outputs.run }}"
          # NOAA at the units, for its calibrated band there (providers-v1); a failure leaves the units on ECMWF's band alone
          python noaa.py --units "${{ steps.day.outputs.run }}" || echo "::warning title=janela noaa units::not read — the units decide on ECMWF's band alone today"
      - name: "the surface current at every place (currents.py, Copernicus Marine: shown, never decided), the sites' kept"
        if: steps.day.outputs.done != 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          (cd apps/janela/audit && python currents.py "${{ steps.day.outputs.run }}")
          bash apps/janela/audit/push.sh "Janela currents $(date -u +%F): the Copernicus Marine surface current at the Janela sites, kept (shown, never decided)" corpus/janela/currents
      - name: "the app's day, gated: both batteries, the run matched, every published decision re-decided from the written bytes"
        if: steps.day.outputs.done != 'true'
        run: node apps/janela/build-today.js --out "$RUNNER_TEMP/janela-field"
      - name: keep the day's decisions at the observable sites on main (written once; graded once the days are observed)
        if: steps.day.outputs.done != 'true'
        continue-on-error: true
        run: |
          node apps/janela/audit/decisions.js archive "$RUNNER_TEMP/janela-field/today.json"
          bash apps/janela/audit/push.sh "Janela decisions $(date -u +%F): the published decisions at the open-sea sites, kept for decision-level grading" certs/janela-decisions
      - name: publish the app's day as the single commit of the orphan branch janela-field
        if: steps.day.outputs.done != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ steps.day.outputs.run }}
        run: |
          # the main commit the day was BUILT on (today.json names it), not a later push of this run
          main=$(node -p "require(process.env.RUNNER_TEMP + '/janela-field/today.json').git")
          cd "$RUNNER_TEMP/janela-field"
          printf '%s\n' "# janela-field — the Janela app's day, overwritten daily" "" \
            "today.json: every place's forecast steps, its bands rounded outward and every published decision, with the sha256 of the deciding modules and of every input record." \
            "field.bin: the ECMWF forecast field over the Brazilian margin (JNF1; apps/janela/audit/field.py). ECMWF open data, CC BY 4.0." \
            "" "Built by apps/janela/build-today.js on main ${main}; one commit, force-pushed, so main never grows by a day of app data." \
            "Re-run: git checkout ${main} && python apps/janela/audit/field.py ${RUN} && python apps/janela/audit/noaa.py --units ${RUN} && node apps/janela/build-today.js --feed ${RUN//-/}" > README.md
          # Vercel reads the deployed commit's own vercel.json: this branch is data, never a deployment
          printf '%s\n' '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q -b janela-field
          git config user.name "janela-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.json field.bin README.md vercel.json
          git commit -q -m "Janela day ${RUN}: the app's data (today.json, field.bin), gated by build-today.js on main ${main:0:12}"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" janela-field
