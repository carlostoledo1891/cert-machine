# The cryptids audit, the kernel lane (arm-neutral; notes/cryptids-benchmark-preregistration-2026-10-23.md):
# google-deepmind/cryptids at its pin, built with its own toolchain (Lean v4.35.0-rc4 and the Mathlib cache), then audited
# with leanprover/comparator at the tag that matches that toolchain, using the configurations the repository SHIPS
# (comparator/constructive.json, all.json, busy_beaver.json), with nanoda — the independent Rust kernel — switched on. The
# challenge and the solution are both theirs: Challenge.lean / BusyBeaverChallenge.lean state the theorems with sorry,
# Cryptids / BusyBeaver prove them; Comparator checks that each named theorem states exactly what the challenge states,
# that only the permitted axioms are used, and replays the proofs through Lean's kernel and through nanoda.
#
# What this decides: that the build at the pin compiles, that the stated theorems are the ones proved, that the axiom
# lists are as printed, and that a second kernel accepts the proofs — a concordance with the repository's own CI, never
# a verification of the mathematics (the halting equivalences are the kernel's). A job that cannot finish is REFUSED,
# never REFUTED. Public-repository runners are free; nothing here pushes. Each job uploads cryptids-<config>
# (result.json + logs); tools/record-cryptids-kernel.js writes certs/cryptids-kernel.json from the artifacts.
#   gh workflow run cryptids-kernel.yml -f configs="constructive all"            (the conjecture-checking library)
#   gh workflow run cryptids-kernel.yml -f configs="busy_beaver"                 (the 299 holdout theorems; long)
name: cryptids-kernel
on:
  workflow_dispatch:
    inputs:
      configs:
        description: 'space-separated comparator configurations (constructive, all, busy_beaver)'
        required: true
        default: 'constructive all'
permissions:
  contents: read
env:
  CRYPTIDS_REPO: https://github.com/google-deepmind/cryptids.git
  CRYPTIDS_PIN: 664cd03904a870e9a8796476dbf9dbc13a72a37b
  LEAN_TOOLCHAIN: leanprover/lean4:v4.35.0-rc4
  COMPARATOR_TAG: v4.35.0-rc4          # the comparator release whose lean-toolchain is the repository's
  LANDRUN_PIN: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4      # as in the openai/math and Nexus lanes
  NANODA_PIN: 3a2407216ee84a75f9e1aead6803d0578be06ae7       # as in the openai/math and Nexus lanes (1 GiB worker stack)
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          LIST: ${{ inputs.configs }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          names = [n for n in os.environ['LIST'].split() if n]
          assert names and all(n in ('constructive', 'all', 'busy_beaver') for n in names), 'bad config list'
          print('matrix=' + json.dumps(list(dict.fromkeys(names))))
          EOF

  tools:
    runs-on: ubuntu-24.04
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/kernel-tools
          key: cryptids-tools-${{ env.LEAN_TOOLCHAIN }}-${{ env.COMPARATOR_TAG }}-${{ env.LANDRUN_PIN }}-${{ env.NANODA_PIN }}-stack1g
      - name: build comparator (at its tag, with the repository's toolchain), lean4export (the revision its manifest pins), landrun, nanoda
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p ~/kernel-tools/bin ~/src && cd ~/src
          git clone -q https://github.com/leanprover/comparator.git && cd comparator && git checkout -q "$COMPARATOR_TAG"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          git rev-parse HEAD > ~/kernel-tools/comparator.rev
          lake build lean4export comparator
          cp .lake/build/bin/comparator ~/kernel-tools/bin/
          cp .lake/packages/lean4export/.lake/build/bin/lean4export ~/kernel-tools/bin/
          (cd .lake/packages/lean4export && git rev-parse HEAD) > ~/kernel-tools/lean4export.rev
          cd ~/src && git clone -q https://github.com/Zouuup/landrun.git && cd landrun && git checkout -q "$LANDRUN_PIN"
          go build -o ~/kernel-tools/bin/landrun ./cmd/landrun
          cd ~/src && git clone -q https://github.com/ammkrn/nanoda_lib.git && cd nanoda_lib && git checkout -q "$NANODA_PIN"
          # ONE change to nanoda, as in the earlier lanes: its worker threads' stack raised to 1 GiB
          sed -i 's/pub(crate) const STACK_SIZE: usize = 16_777_216;/pub(crate) const STACK_SIZE: usize = 1_073_741_824;/' src/lib.rs
          test "$(git diff --numstat src/lib.rs | awk '{print $1+$2}')" = "2"
          git diff | tee ~/kernel-tools/nanoda.patch
          cargo build --release -q
          cp target/release/nanoda_bin ~/kernel-tools/bin/
          ls -la ~/kernel-tools/bin
      - uses: actions/upload-artifact@v4
        with:
          name: cryptids-kernel-tools
          path: ~/kernel-tools
          retention-days: 3

  check:
    needs: [plan, tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CONFIG: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/cryptids-kernel-result.py
            PROVENANCE-cryptids.json
          sparse-checkout-cone-mode: false
          path: audit
      - uses: actions/download-artifact@v4
        with:
          name: cryptids-kernel-tools
          path: ~/kernel-tools
      - name: free disk and allow user namespaces (comparator's sandbox)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h / | tail -1
      - name: toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          chmod +x ~/kernel-tools/bin/*
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "$HOME/kernel-tools/bin" >> "$GITHUB_PATH"
      - name: the repository at its pin, held to the lifted digests
        run: |
          set -euo pipefail
          git clone -q "$CRYPTIDS_REPO" cryptids && cd cryptids && git checkout -q "$CRYPTIDS_PIN"
          test "$(git rev-parse HEAD)" = "$CRYPTIDS_PIN"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          python3 - <<'EOF'
          import hashlib, json
          prov = json.load(open('../audit/PROVENANCE-cryptids.json'))
          files = prov.get('files') or prov.get('items') or {}
          n = 0
          for rec in (files.values() if isinstance(files, dict) else files):
              src = rec.get('src') or rec.get('source') or rec.get('path')
              want = rec.get('source_sha256') or rec.get('src_sha256') or rec.get('sha256')
              if not src or not want:
                  continue
              got = hashlib.sha256(open(src, 'rb').read()).hexdigest()
              assert got == want, 'the pinned file moved: ' + src
              n += 1
          print('held to the lifted digests:', n, 'files')
          EOF
          cat comparator/$CONFIG.json | head -8
      - name: dependencies and the Mathlib cache
        working-directory: cryptids
        run: |
          set -euo pipefail
          start=$(date +%s)
          lake exe cache get 2>&1 | tail -5
          echo "CACHE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          df -h / | tail -1
      - name: build the libraries the configuration audits
        working-directory: cryptids
        run: |
          set -euo pipefail
          start=$(date +%s)
          if [ "$CONFIG" = "busy_beaver" ]; then LEAN_NUM_THREADS=2 lake build BusyBeaver BusyBeaverChallenge 2>&1 | tail -20; else LEAN_NUM_THREADS=2 lake build Cryptids Challenge 2>&1 | tail -20; fi
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: comparator, Lean's kernel and nanoda, on the configuration the repository ships
        working-directory: cryptids
        run: |
          set +e
          mkdir -p ~/out
          {
            echo "kernel: $(uname -r)"; echo "landlock: $(cat /sys/kernel/security/lsm 2>/dev/null)"
            lean --version
            echo "comparator rev: $(cat ~/kernel-tools/comparator.rev)"
            echo "lean4export rev: $(cat ~/kernel-tools/lean4export.rev)"
            echo "nanoda build: stack1g"
          } > ~/out/env.txt 2>&1
          python3 - <<'EOF'
          import json
          c = json.load(open('comparator/' + __import__('os').environ['CONFIG'] + '.json'))
          c['enable_nanoda'] = True   # the comparator README: enable_nanoda calls nanoda_bin beside Lean's kernel (the first dispatch set a key comparator ignores, 2026-10-23)
          json.dump(c, open('audit-config.json', 'w'), indent=1)
          print('theorems:', len(c['theorem_names']), 'axioms:', c['permitted_axioms'])
          EOF
          ulimit -s unlimited || ulimit -s 4194304 || true
          export RUST_MIN_STACK=1073741824
          start=$(date +%s)
          /usr/bin/time -v lake env comparator audit-config.json > ~/out/comparator.log 2> ~/out/comparator.err
          echo $? > ~/out/exit.txt
          echo $(( $(date +%s) - start )) > ~/out/seconds.txt
          cp audit-config.json comparator/$CONFIG.json ~/out/
          sha256sum Challenge.lean BusyBeaverChallenge.lean lean-toolchain lake-manifest.json > ~/out/sha256.txt
          tail -40 ~/out/comparator.log; tail -40 ~/out/comparator.err
          exit 0
      - name: result
        if: always()
        run: python3 audit/tools/cryptids-kernel-result.py ~/out "$CONFIG" > ~/out/result.json && cat ~/out/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cryptids-${{ matrix.config }}
          path: ~/out
          retention-days: 30
